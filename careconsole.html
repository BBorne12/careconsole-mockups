<style>
  :root {
    --primary-color: #004C97; --primary-hover-color: #00366b; --primary-light-color: #d8e4ef; --primary-disabled-color: #7CB6D4;
    --secondary-color: #E5E8EA; --danger-color: #BF2B0D; --success-color: #027E02; --warning-color: #7A6200; --purple-color: #6000e5;
    --font: "Poppins", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-width: 1500px; font-family: var(--font); font-size: 14px; color: #000; background: #fff; }
  a { color: var(--primary-color); text-decoration: none; cursor: pointer; }
  button, select, input { font-family: inherit; }

  /* ---------- Top menu bar ---------- */
  .menuHeaderBar { height: 53px; background: var(--secondary-color); border-bottom: 3px solid var(--primary-color); display: flex; align-items: center; color: #353535; }
  .menuHeaderBar .logo { width: 250px; height: 50px; margin-left: 10px; cursor: pointer; }
  .menuNav { display: flex; margin-left: 30px; flex: 1; align-self: stretch; }
  .menuNav > .top { position: relative; display: flex; align-items: center; }
  .menuNav > .top > a { font-size: 14px; padding: 0 30px; height: 100%; display: flex; align-items: center; letter-spacing: .2px; text-transform: uppercase; }
  .menuNav > .top:hover > a, .menuNav > .top.open > a { background: var(--primary-color); color: #fff; }
  .subMenu { display: none; position: absolute; top: 100%; left: 0; z-index: 20002; background: #fff; border: 1px solid #666; padding: 1px 5px; min-width: 260px; list-style: none; margin: 0; box-shadow: 2px 3px 6px rgba(0,0,0,.25); }
  .menuNav > .top:hover > .subMenu, .menuNav > .top.open > .subMenu { display: block; }
  .subMenu li { position: relative; }
  .subMenu li + li { border-top: 1px solid rgb(168, 168, 168); }
  .subMenu li > a { display: block; padding: 12px 40px; font-size: 15px; color: var(--primary-color); text-align: center; white-space: nowrap; }
  .subMenu li:hover > a { background: rgb(242, 242, 242); }
  .subMenu li.hasSub > a::after { content: '▸'; position: absolute; right: 10px; color: #555; }
  .subMenu .subMenu { top: -2px; left: 100%; }
  .subMenu li.hasSub:hover > .subMenu { display: block; }
  .subMenu.scroll { max-height: 70vh; overflow-y: auto; }
  .menuUser { font-size: 14px; margin-right: 50px; }
  .menuIcons { display: flex; gap: 22px; align-items: center; margin-right: 26px; }
  .menuIcons span { position: relative; display: inline-flex; }
  .menuIcons img { height: 24px; }
  .menuIcons .badge { position: absolute; top: -6px; right: -9px; background: var(--danger-color); color: #fff; font-size: 9px; min-width: 15px; height: 15px; border-radius: 8px; display: grid; place-items: center; padding: 0 3px; }
  .logout { font-size: 14px; margin-right: 10px; }

  /* ---------- Customer / patient panel ---------- */
  .navPanel { background: var(--secondary-color); display: flex; height: 140px; }
  .navPanel .filters { flex: 1; padding: 6px 0 0 45px; }
  .navPanel .row1 { display: flex; align-items: flex-end; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid #b4b9bd; margin-right: 24px; }
  .textBoldNavMenu { display: block; font-size: 14px; padding: 5px 10px 5px 0; }
  .navPanel select { width: 170px; height: 26px; font-size: 14px; border: 1px solid #9aa0a6; background: #fff; }
  .navPanel select:disabled { color: #aaa; background: #f3f4f5; border-color: #ccd0d4; }
  .navPanel .resetLink { font-size: 14px; margin: 0 40px 4px 10px; }
  .navPanel .pin { color: var(--primary-color); margin-bottom: 4px; font-size: 14px; }
  .navPanel .patient { width: 250px; border-left: 1px solid #b4b9bd; border-right: 1px solid #b4b9bd; padding: 6px 0 0 15px; }
  .navPanel .patient select { width: 200px; border: 2px solid #333; }
  .navPanel .refresh { display: inline-block; margin-top: 6px; font-size: 14px; }
  .navPanel .cards { width: 260px; display: grid; place-items: center; }
  .collapseTab { width: 120px; height: 22px; margin: 0 auto; background: var(--secondary-color); display: grid; place-items: center; color: #8a8f94; font-size: 11px; cursor: pointer; }
  body.panelHidden .navPanel { display: none; }

  /* ---------- Work list header ---------- */
  .wl { padding: 6px 8px 0; }
  .titleRow { display: flex; align-items: center; gap: 30px; }
  .page_title { margin: 0; font-size: 24px; font-weight: 700; color: var(--primary-color); }
  .dateNav { display: flex; align-items: center; gap: 6px; }
  .dateNav button { width: 56px; height: 22px; border: none; border-radius: 2px; color: #fff; background: var(--primary-color); font-size: 13px; cursor: pointer; }
  .dateNav button:disabled { background: var(--primary-disabled-color); cursor: default; }
  .dateNav input { height: 22px; width: 130px; font-size: 13px; border: 1px solid #9aa0a6; padding: 0 2px; }
  .counts { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin: 6px 0 0; font-size: 12px; font-weight: 600; }
  .counts label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .counts input { margin: 0; }
  .counts .v { color: var(--primary-color); }
  .counts .bar { width: 1px; height: 16px; background: #000; }
  .cPurple { color: var(--purple-color); } .cRed { color: var(--danger-color); } .cYel { color: var(--warning-color); } .cGrn { color: var(--success-color); } .cGray { color: #5f5f5f; } .cBlue { color: var(--primary-color); }
  .divLowerFilter { display: flex; align-items: center; gap: 8px; background: var(--primary-color); padding: 5px 4px 4px; margin-top: 6px; }
  .worklist_button { cursor: pointer; color: #000; border-radius: 3px; border: 1px solid #ccc; background: #f7f7f7; padding: 2px 12px; font-weight: 600; font-size: 12px; margin: 0 5px; }
  .divLowerFilter .vbar { width: 1px; height: 20px; background: #8fb0d2; }
  .divLowerFilter .lblWhite14 { color: #fff; font-size: 12px; font-weight: 600; }
  .divLowerFilter select { height: 22px; font-size: 11px; font-weight: 600; width: 160px; }
  .divLowerFilter a { color: #fff; font-size: 12px; text-decoration: underline; }
  .divLowerFilter .mv { margin-left: auto; border-left: 1px solid #8fb0d2; padding-left: 8px; margin-right: 6px; }
  .paging { display: flex; justify-content: space-between; align-items: center; padding: 6px 5px; font-size: 12px; font-weight: 700; }
  .pages { display: flex; gap: 3px; }
  .pages span { min-width: 18px; height: 18px; border: 1px solid var(--primary-color); border-radius: 2px; color: var(--primary-color); display: grid; place-items: center; font-size: 11px; }
  .pages span.on { background: var(--primary-color); color: #fff; }
  .pages span.dis { border-color: #ccc; color: #bbb; }

  /* ---------- Work list table ---------- */
  .tblWorkList { font-size: 11px; font-weight: 600; width: 100%; border-collapse: collapse; }
  .tblWorkList tr { border: 2px solid rgb(212, 231, 240); }
  .tblWorkList thead th { position: sticky; top: 0; z-index: 2; background: var(--primary-color); color: #fff; padding: 3px 0; height: 30px; font-weight: 700; white-space: nowrap; }
  .tblWorkList th.sort { cursor: pointer; text-align: left; }
  .tblWorkList th img.sortImg { height: 14px; vertical-align: middle; }
  .tblWorkList td { border-right: 1px solid #9b9b9b; min-width: 40px; text-align: center; height: 26px; padding: 1px 2px; white-space: nowrap; }
  .tblWorkList td:first-child, .tblWorkList td:nth-child(2) { border-right: none; }
  .tblWorkList td:last-child { border: none; }
  .tblWorkList td.left { text-align: left; }
  .tblWorkList tr.trOverlay td { background-color: var(--secondary-color); }
  .cellCk { display: flex; align-items: center; width: 50px; }
  .chkBox { flex: none; width: 23px; height: 24px; background-position: center; background-repeat: no-repeat; display: grid; place-items: center; }
  .chkBox input { margin: 0; cursor: pointer; }
  .ackCircle { flex: none; width: 24px; height: 24px; border-radius: 12px; margin-left: 1px; display: flex; justify-content: center; align-items: center; background: var(--primary-color); }
  .ackCircle img { width: 16px; height: 16px; cursor: pointer; }
  .lblBlue { color: var(--primary-color); font-weight: 600; }
  .expander img { width: 16px; height: 16px; cursor: pointer; vertical-align: middle; }
  .readingCellL { background: rgb(234, 251, 231); } .readingCellM { background: rgb(251, 245, 231); } .readingCellH { background: rgb(251, 236, 232); }
  .readingValueL { color: var(--success-color); } .readingValueM { color: var(--warning-color); } .readingValueH { color: var(--danger-color); }
  .dmpCnt .sep { margin: 0 1px; color: #000; }

      const rows = vitalsRows(p, r.vf, r.vt); const L = [`Vital Records for ${p.last}, ${p.first}  ${mmddyyyy(r.vf)} - ${mmddyyyy(r.vt)}`, ''];
      rows.forEach(x => { const v = x.v; L.push(`${mmddyyyy(dateOf(x.day))} ${ampm(v[0])}  Wt ${v[1]}${p.prog !== 'WM' ? `  BP ${v[2]}/${v[3]}  HR ${v[4]}` : ''}${p.prog === 'HF' && v[5] ? `  SpO2 ${v[5]}%` : ''}`); });
      return wrap80(L.join('\n'));

    $('dCopy').onclick = () => { const L = [`DMP Summary for ${p.last}, ${p.first}  ${mmddyyyy(r.df)} - ${mmddyyyy(r.dt)}`, '']; dmpSessions(p, r.df, r.dt).forEach(s => { L.push(`${mmddyyyy(dateOf(s.day))}  ${p.dmpName} session ${p.sess[s.day - 1] || '-'}`); s.q.forEach(x => L.push(`  Q: ${CC_Q[x[1]]}  A: ${x[2]}  Risk: ${RISK[x[3]]}`)); }); copyText(wrap80(L.join('\n'))); };
    $('nCopy').onclick = () => { const tmp = document.createElement('div'); tmp.innerHTML = pastNotes(p, r.nf, r.nt); copyText(wrap80(tmp.innerText)); };

  // ----- Pending Enrollment Report (Enroll a Patient) -----

      <div style="text-align:right;margin-top:8px"><span class="xls" id="xls">Export To Excel</span></div><div style="text-align:right;font-weight:600;margin-top:4px">Total Pending Patients: ${PEND.length}</div>
      <div class="fbar"><span class="lbl">Filter By</span><select id="fCc">${opts(['All Care Coordinators', 'Borne, Ben'], pendF.cc)}</select><select id="fSt">${opts(['All Pending', 'Ready to Enroll', 'Pending more than 5+ days', 'Waiting on Task Orders'], pendF.state)}</select>
        <select id="fDel">${opts(['All Delivery Status', 'Delivered', 'Exception', 'In Transit', 'Invalid tracking number', 'Manifest Pickup', 'No matching status', 'No tracking information available', 'Pickup'], pendF.del)}</select><a id="fReset">Reset</a></div>

        ${pendF.exp === x.id ? `<tr class="det"><td></td><td colspan="10"><span style="display:inline-block;width:200px">Tracking: ${x.track || 'Not set'}</span> <span>Task Order: ${x.taskOrder}</span> <span style="margin-left:30px">Disease: ${x.disease}</span></td></tr>` : ''}`).join('') || '<tr><td colspan="11" class="c">No data to display</td></tr>'}</table>

    main.querySelectorAll('[data-note]').forEach(a => a.onclick = () => { const x = PEND.find(y => y.id === a.dataset.note); popup(`<h2>Edit Note</h2><textarea id="pnTxt">${esc(x.note)}</textarea><div class="foot"><button class="btnOutline" data-close>Cancel</button><button class="btnBlue" id="pnSave">Save</button></div>`, pp => pp.querySelector('#pnSave').onclick = () => { x.note = pp.querySelector('#pnTxt').value.trim(); savePend(); closePop(); re(); }); });
    $('xls').onclick = () => download('PendingEnrollmentReport.csv', [['ICN', 'SSN', 'Patient Name', 'Days Pending', 'Task Orders', 'Modality', 'Delivery Status', 'Care Coordinator', 'Note'], ...list.map(x => [x.icn, '$$$$$$', `${x.last}, ${x.first}`, x.days, x.tasks, x.modality, x.delivery, x.cc, x.note])]);

  // ----- Patient Registration (Manual Enrollment) -----
  ROUTES.registration = (q) => {

    const field = (label, id, val = '', req = true, type = 'text') => `<label>${label}${req ? ' <span class="req">*</span>' : ''}</label><input type="${type}" id="${id}" value="${esc(val)}"${req ? ' data-req' : ''}>`;

      ${acc('g-assign', 'Patient Assignment', `<p class="lead">Please select or enter the Required Fields to assign patient to their program.</p><div class="fgrid">
        <label>Status: <span class="req">*</span></label><span>Enrolled-Pending</span>${field('ICN:', 'gIcn', v('icn'))}

      ${acc('g-demo', 'Demographics', `<p class="lead">Next let's get some patient information</p><div class="sub">Patient Name</div><div class="fgrid">

        ${field('DOB:', 'gDob', v('dob'), true, 'date')}
        <label>Gender: <span class="req">*</span></label><span id="gSex">${['Male', 'Female', 'Other'].map(s => `<label><input type="radio" name="gSex" value="${s}" ${x && (x.sex === 'M' ? 'Male' : 'Female') === s ? 'checked' : ''}> ${s}</label>`).join(' ')}</span>
        <label>Primary Language: <span class="req">*</span></label><select id="gLang" data-req>${opts(['', 'English', 'Spanish', 'Other'], 'English')}</select>
        <label>Speaks English:</label><span><label><input type="checkbox" checked> Yes</label> <label><input type="checkbox"> No</label></span></div>
        <div class="sub">Patient Contact</div><div class="fgrid">${field('Phone Number:', 'gPhone', x ? '217555012' + x.id.slice(1) : '')}<label>Type:</label><select>${opts(['Cellular', 'Home', 'Work'], 'Cellular')}</select></div>
        <div class="sub">Patient Address</div><div class="fgrid">${field('Address:', 'gAddr', x ? `${100 + 7 * +x.id.slice(1)} Demo St` : '')}${field('Apt #:', 'gApt', '', false)}${field('Address 2:', 'gAddr2', '', false)}${field('City:', 'gCity', x ? 'Springfield' : '')}
          <label>State: <span class="req">*</span></label><select id="gState" data-req>${opts(['', 'Illinois', 'Indiana', 'Iowa', 'Missouri', 'Wisconsin'], x ? 'Illinois' : '')}</select>${field('Zip:', 'gZip', x ? '62701' : '')}
          <label>Time Zone: <span class="req">*</span></label><select id="gTz" data-req>${opts(['', 'Central (CST/CDT)', 'Eastern (EST/EDT)', 'Mountain (MST/MDT)', 'Pacific (PST/PDT)'], x ? 'Central (CST/CDT)' : '')}</select></div>
        <div class="sub">Emergency Contact</div><div class="fgrid">${field('First Name:', 'gEf', '', false)}${field('Last Name:', 'gEl', '', false)}<label>Relationship:</label><select>${opts(['', 'Spouse', 'Child', 'Sibling', 'Friend', 'Other'], '')}</select>${field('Phone Number:', 'gEp', '', false)}</div>`, true)}
      ${acc('g-dev', 'Device Assignment and Schedule', `<p class="lead">Review and confirm the below devices and service</p><div class="fgrid">
        <label>Delivery Method: <span class="req">*</span></label><select id="gDm" data-req>${opts(['', 'Hub', 'IVR', 'IVR/Modem', 'Web', 'Web/Modem', 'IVR Only (Self Report)'], x ? x.modality : '')}</select>
        <label>Tracking Number:</label><span><input type="text" id="gTrack" value="${esc(v('track'))}" style="width:180px"> <label><input type="radio" checked> UPS</label></span></div>
        <div class="sub">Select your patient's peripherals and set thresholds</div><div>${['Blood Pressure', 'Weight Scale', 'Pulse Oximeter', 'Glucometer', 'Thermometer'].map(d => `<label style="margin-right:16px"><input type="checkbox" class="gPer" value="${d}"> ${d}</label>`).join('')}</div>`, true)}
      ${acc('g-dmp', 'DMP Assignment and Schedule', `<div class="fgrid"><label>Disease: <span class="req">*</span></label><select id="gDis" data-req>${opts(['', 'CHF', 'COPD', 'Diabetes', 'Hypertension', 'Weight Management', 'Depression', 'PTSD'], v('disease'))}</select>
        <label>DMP: <span class="req">*</span></label><select id="gDmp" data-req>${opts(['', 'VHA CHF', 'VHA COPD', 'VHA Diabetes 063023', 'VHA Hypertension 093023', 'VHA L2 WM 093019', 'VHA Depression 063023', 'VHA PTSD 063023'], '')}</select>
        <label>Session Time:</label><select>${opts(['Anytime', 'Morning', 'Afternoon', 'Evening'], 'Anytime')}</select><span></span><span></span></div>`, true)}
      <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:18px"><button class="btnOutline btnBig" id="gCancel">Cancel</button><button class="btnBlue btnBig" id="gSave">Save</button></div></div>`;
    $('gCancel').onclick = () => { location.hash = '#pending'; };
    $('gSave').onclick = () => {
      let bad = 0; main.querySelectorAll('[data-req]').forEach(i => { const b = !i.value.trim(); i.classList.toggle('badInput', b); if (b) bad++; });

      if (x) { Object.assign(x, rec, { state: 'Ready to Enroll' }); } else PEND.push(Object.assign({ id: 'p' + Date.now(), sex: main.querySelector('input[name=gSex]:checked').value[0], delivery: rec.track ? 'In Transit' : 'No tracking information available', tasks: 0, state: 'Waiting on Task Orders', days: 0, cc: $('gCc').value, note: '', taskOrder: '' }, rec));

  // ----- All Assigned Tasks -----

    const list = TASKS.filter(t => t.pt === p.id && inRange(t) && (taskF.title === 'All Task Titles' || t.title === taskF.title)

      .sort((a, b) => a.due.localeCompare(b.due));
    main.innerHTML = `<div class="page"><h1 class="pt">All Assigned Tasks</h1><div style="margin-bottom:8px"><b>Patient Name:</b> <span class="lnkPlain">${esc(fullName(p))}</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center">${dateRow(taskF.from, taskF.to, taskF.spec, NEXT)}<b>Total Tasks: ${list.length}</b></div>
      <div class="fbar"><span class="lbl">Filter By</span><select id="tState">${opts(['All Uncompleted Tasks', 'All Completed Tasks', 'All Tasks', 'Canceled Tasks'], taskF.state)}</select><select><option>All Care Coordinators</option><option>Borne, Ben</option></select>
        <select id="tTitle">${opts(['All Task Titles', 'Monthly Note', ...TASK_NAMES], taskF.title)}</select><span class="right"><button class="btnWhite" id="tNew">Create New Task</button><button class="btnWhite" id="tDone" disabled>Complete</button></span></div>
      <table class="grid"><tr><th style="width:30px">#</th><th>Task Title</th><th>Due Date</th><th>Recurrence</th><th>End Date</th><th>Created By</th><th>Task Status</th></tr>
      ${list.map(t => `<tr><td><input type="checkbox" data-tk="${t.id}" ${t.status !== 'Not Completed' ? 'disabled' : ''}></td><td><a class="lnk" data-tedit="${t.id}">${esc(t.title)}</a>${t.rec !== 'Single' ? '*' : ''}</td><td${fromIso(t.due) < TODAY && t.status === 'Not Completed' ? ' style="color:var(--danger-color);font-weight:600"' : ''}>${mmddyyyy(fromIso(t.due))}</td><td>${t.rec === 'Single' ? '' : t.rec}</td><td>${t.end ? mmddyyyy(fromIso(t.end)) : ''}</td><td>${t.by}</td><td>${t.status}</td></tr>`).join('') || '<tr><td colspan="7" class="c">No data to display</td></tr>'}</table></div>`;
    wireDates((f, t, s) => { taskF.from = f; taskF.to = t; taskF.spec = s; ROUTES.tasks(); });
    $('dSpec').onchange = e => { const s = e.target.value; taskF.spec = s; if (s !== 'c' && s !== 'od') { taskF.from = TODAY; taskF.to = dateOf(DAYS + +s); } ROUTES.tasks(); };
    $('tState').onchange = e => { taskF.state = e.target.value; ROUTES.tasks(); }; $('tTitle').onchange = e => { taskF.title = e.target.value; ROUTES.tasks(); };
    main.querySelectorAll('[data-tk]').forEach(c => c.onchange = () => { $('tDone').disabled = !main.querySelector('[data-tk]:checked'); });
    $('tDone').onclick = () => { const ids = [...main.querySelectorAll('[data-tk]:checked')].map(c => c.dataset.tk); ids.forEach(id => { const t = TASKS.find(x => x.id === id); t.status = 'Completed'; if (t.rec.startsWith('Every')) { const n = { 'Every 30 Days': 30, 'Every 60 Days': 60, 'Every 90 Days': 90, 'Every 120 Days': 120, 'Every 6 Months': 182, 'Every Year': 365 }[t.rec] || 30; TASKS.push({ ...t, id: 't' + Date.now() + Math.random().toString(36).slice(2, 5), due: iso(new Date(fromIso(t.due).getTime() + n * 864e5)), status: 'Not Completed' }); } }); saveTasks(); toast(`${ids.length} task(s) completed`); ROUTES.tasks(); };
    $('tNew').onclick = () => taskPopup(p);
    main.querySelectorAll('[data-tedit]').forEach(a => a.onclick = () => taskPopup(p, TASKS.find(t => t.id === a.dataset.tedit)));
    return 'All Assigned Tasks';
  };
  function taskPopup(p, t) {
    let tab = t && t.rec === 'Single' ? 'Single Task' : t && /Week/.test(t.rec) ? 'Weekly Task' : 'Monthly Task';
    const pp = popup(`<h2>${t ? 'Edit Task' : 'Create New Task'}</h2><div>Create a task by entering task name and due date.</div><div style="margin-top:8px"><b>Patient Name:</b> <span class="lnkPlain">${esc(fullName(p))}</span></div>
      <label class="f">Task Name <span class="req">*</span></label><select id="tkName">${opts(['Select', 'Monthly Note', ...TASK_NAMES], t ? t.title : 'Select')}</select>
      <label class="f">Task Note</label><textarea id="tkNote">${esc(t ? t.note : '')}</textarea>
      <div class="tabs">${['Monthly Task', 'Weekly Task', 'Single Task'].map(x => `<span data-tab="${x}" class="${x === tab ? 'on' : ''}">${x}</span>`).join('')}</div><div class="tabBody" id="tkBody"></div>
      <div class="foot"><button class="btnOutline btnBig" data-close>Close</button>${t && t.status === 'Not Completed' ? '<button class="btnOutline btnBig" id="tkCancelTask">Cancel Task</button>' : ''}<button class="btnBlue btnBig" id="tkSave">${t ? 'Save' : 'Create'}</button></div>`);
    const body = pp.querySelector('#tkBody');
    const draw = () => {
      pp.querySelectorAll('[data-tab]').forEach(s => s.classList.toggle('on', s.dataset.tab === tab));
      body.innerHTML = tab === 'Monthly Task' ? `First Due Date<span class="req">*</span> <input type="date" id="tkDue" value="${t ? t.due : ''}"> <label><input type="checkbox"> Use Specific Date</label> &nbsp; Recurrence <span class="req">*</span> <select id="tkRec">${opts(['Select', 'Every 30 Days', 'Every 60 Days', 'Every 90 Days', 'Every 120 Days', 'Every 6 Months', 'Every Year'], t ? t.rec : 'Select')}</select>

      <div style="border-top:1px solid #ccc;margin-top:14px;padding-top:10px"><a class="lnk">Device History</a>
        <table class="grid" style="margin-top:8px"><tr><th>#</th><th>Device Type</th><th>Serial Number</th><th>Model Type</th><th>Date Assigned</th><th>Assigned By</th><th>Date Unassigned</th><th>Unassigned By</th><th>Status</th></tr>
        ${ds.map((d, i) => `<tr><td>${i + 1}</td><td>${d.type}</td><td>${d.serial}</td><td>${d.model}</td><td>${d.assigned}</td><td>${d.by}</td><td>${d.unassigned}</td><td>${d.unBy}</td><td>${d.status}</td></tr>`).join('')}</table></div>
      <div style="margin-top:14px"><a class="lnk" href="#devices">&laquo; Back to Device Summary Report</a></div></div>`;
    $('dvUpdate').onclick = () => {
      const sw = [...main.querySelectorAll('[data-swap]')].filter(i => i.value.trim()); if (!sw.length) return msgBox('Enter a new serial number to assign or swap a device.');
      for (const i of sw) { const s = i.value.trim().toUpperCase(); if (!/^[A-Z0-9-]{5,20}$/.test(s)) return msgBox(`"${s}" is not a valid serial number.`); if (Object.values(DEVS).flat().some(d => d.serial === s)) return msgBox(`Serial number ${s} is already assigned.`); }
      sw.forEach(i => { const old = cur[+i.dataset.swap]; old.status = 'Unassigned'; old.unassigned = mmddyyyy(TODAY); old.unBy = 'Borne, Ben'; ds.push({ type: old.type, serial: i.value.trim().toUpperCase(), model: old.model, assigned: mmddyyyy(TODAY), by: 'Borne, Ben', unassigned: '', unBy: '', status: 'Assigned' }); });
      saveDevs(); toast('Device assignment updated'); ROUTES.device();
    };
    return 'Patient Device Management';
  };
  let ANN = getJson('ccAnnouncements', null);
  if (!ANN) ANN = [
    { id: 'a1', head: 'CareConsole 2.25 Release - Now Available', body: 'Contact your Account Executive or Account Manager to learn more about this release.', cta: '', state: 'published', date: '01/29/2025', by: 'b. borne' },
    { id: 'a2', head: 'New Post Hospital Discharge DMP is now available!', body: 'This 45 day DMP is available in the DMP library. Please reach out to your dedicated Account Manager for more information.', cta: '', state: 'published', date: '05/09/2024', by: 'b. borne' },
    { id: 'a3', head: 'Holiday schedule', body: 'Customer Service hours will change for the holiday week.', cta: '', state: 'draft', date: '06/20/2026', by: 'b. borne' }];
  const saveAnn = () => setJson('ccAnnouncements', ANN);
  let annOpen = { pub: false, dr: false };
  ROUTES.announcements = () => {
    const pub = ANN.filter(a => a.state === 'published'), dr = ANN.filter(a => a.state === 'draft');
    const card = (a, i) => `<div class="annCard"><span class="n">&#8801; ${i + 1}</span><div><b>Headline</b>${esc(a.head)}</div><div><b>Body Copy</b>${esc(a.body)}</div><div><b>Date &amp; Author</b>${a.state === 'published' ? 'Published' : 'Saved'} on ${a.date}<br>by ${a.by}</div><div><button class="btnWhite" data-ann="${a.id}">Manage Post</button></div></div>`;
    main.innerHTML = `<div class="page" style="max-width:1000px;margin:0 auto"><h1 class="pt center" style="margin:30px 0 40px">Manage Announcements Editor</h1>
      <div class="annRow"><span>Create New Announcement <span class="iCircle" data-tip="Create a new announcement that care coordinators see when they sign in">i</span></span><button class="btnBlue" id="annNew">Create Announcement</button></div>
      <div class="annRow" id="annPub" style="cursor:pointer"><span>${annOpen.pub ? '&minus;' : '+'} Manage Published Announcements <span class="iCircle">i</span></span><small>There are ${pub.length} of 3 published posts</small></div>${annOpen.pub ? pub.map(card).join('') || '<p class="muted">No published posts.</p>' : ''}
      <div class="annRow" id="annDr" style="cursor:pointer"><span>${annOpen.dr ? '&minus;' : '+'} Manage Saved Drafts <span class="iCircle">i</span></span><small>There are ${dr.length} saved drafts</small></div>${annOpen.dr ? dr.map(card).join('') || '<p class="muted">No drafts.</p>' : ''}</div>`;
    $('annPub').onclick = () => { annOpen.pub = !annOpen.pub; ROUTES.announcements(); }; $('annDr').onclick = () => { annOpen.dr = !annOpen.dr; ROUTES.announcements(); };
    $('annNew').onclick = () => annEditor(null); main.querySelectorAll('[data-ann]').forEach(b => b.onclick = () => annEditor(ANN.find(a => a.id === b.dataset.ann)));
    return 'Manage Announcements Editor';
  };
  function annEditor(a) {
    const pp = popup(`<h2>${a ? 'Manage Post' : 'Create Announcement'}</h2><label class="f">Headline</label><input type="text" id="aeHead" style="width:100%" maxlength="80" value="${esc(a ? a.head : '')}">
      <label class="f">Body Copy</label><textarea id="aeBody" style="height:120px">${esc(a ? a.body : '')}</textarea>
      <p class="muted" style="font-size:12px">This enables you to create a hyperlink to your post, please confirm your link address and insert the text you want displayed.</p>
      <label class="f">CTA Link Address</label><input type="text" id="aeCta" style="width:100%" value="${esc(a ? a.cta : '')}"><label class="f">CTA Display Text (21 Characters Max)</label><input type="text" id="aeCtaT" maxlength="21" style="width:220px">
      <div class="foot">${a ? '<button class="btnOutline" id="aeDel">Delete</button>' : ''}<button class="btnOutline" id="aeDraft">Save as Draft</button><button class="btnBlue" id="aePost">Post Announcement</button></div>`);
    const save = st => { const head = pp.querySelector('#aeHead').value.trim(), body = pp.querySelector('#aeBody').value.trim(); if (!head || !body) return msgBox('Please enter a headline and body copy.');
      if (st === 'published' && ANN.filter(x => x.state === 'published' && x !== a).length >= 3) return msgBox('There can be at most 3 published posts. Save as a draft or remove a published post first.');
      const rec = { head, body, cta: pp.querySelector('#aeCta').value.trim(), state: st, date: mmddyyyy(TODAY), by: 'b. borne' }; if (a) Object.assign(a, rec); else ANN.push(Object.assign({ id: 'a' + Date.now() }, rec)); saveAnn(); closePop(); toast(st === 'published' ? 'Announcement posted' : 'Draft saved'); ROUTES.announcements(); };
    pp.querySelector('#aeDraft').onclick = () => save('draft'); pp.querySelector('#aePost').onclick = () => save('published');
    const d = pp.querySelector('#aeDel'); if (d) d.onclick = () => confirmBox('This will delete it & can\'t be undone', () => { ANN = ANN.filter(x => x !== a); saveAnn(); ROUTES.announcements(); }, 'Delete', 'Delete');
  }
  let CROSS = getJson('ccCross', [{ covering: 'VA Demo HCS (999)', covered: 'VA Demo CBOC (999GA)', expires: '07/31/2026', created: '06/01/2026' }]);
  ROUTES.crosscoverage = () => {
    main.innerHTML = `<div class="page"><h1 class="pt">Cross Coverage Editor</h1><h3 style="color:var(--primary-color)">Current Cross Coverage</h3><div style="text-align:right;margin-bottom:6px"><button class="btnBlue" id="ccNew">Create Cross Coverage</button></div>
      <table class="grid"><tr><th>Covering Site</th><th>Covered Site</th><th>Expires</th><th>Created</th><th></th></tr>${CROSS.map((c, i) => `<tr><td>${c.covering}</td><td>${c.covered}</td><td>${c.expires}</td><td>${c.created}</td><td><a class="lnk" data-rm="${i}">Remove</a></td></tr>`).join('') || '<tr><td colspan="5" class="c">No data to display</td></tr>'}</table></div>`;
    const sites = SITES.map(s => s[1]);
    $('ccNew').onclick = () => popup(`<h2>Create Cross Coverage</h2><label class="f">Covering Site</label><select id="xA">${opts(sites, sites[0])}</select><label class="f">Covered Site</label><select id="xB">${opts(sites, sites[1])}</select><label class="f">Expires</label><input type="date" id="xE" value="${iso(dateOf(DAYS + 30))}">
      <div class="foot"><button class="btnOutline" data-close>Cancel</button><button class="btnBlue" id="xSave">Save</button></div>`, pp => pp.querySelector('#xSave').onclick = () => { const a = pp.querySelector('#xA').value, b = pp.querySelector('#xB').value, e = pp.querySelector('#xE').value; if (a === b) return msgBox('The covering and covered sites must be different.'); if (!e) return msgBox('Please enter an expiration date.'); CROSS.push({ covering: a, covered: b, expires: mmddyyyy(fromIso(e)), created: mmddyyyy(TODAY) }); setJson('ccCross', CROSS); closePop(); ROUTES.crosscoverage(); });
    main.querySelectorAll('[data-rm]').forEach(a => a.onclick = () => confirmBox('Remove this cross coverage?', () => { CROSS.splice(+a.dataset.rm, 1); setJson('ccCross', CROSS); ROUTES.crosscoverage(); }, 'Confirm', 'Remove'));
    return 'Cross Coverage Editor';
  };

  // ----- Library (DMP text documents are not part of the mockup) -----
  ROUTES.library = (q) => {
    main.innerHTML = `<div class="page"><div class="libDoc"><h2 style="color:var(--primary-color);margin-top:0">${esc(q.doc || 'Library')}</h2><p>In CareConsole, Library items open the DMP content document (PDF) for the selected program and language.</p>
      <p class="muted">DMP content documents are not included in this mockup.</p><button class="btnBlue" onclick="history.back()">Back</button></div></div>`;
    return 'Library';
  };

  // =====================================================================
  //  Router, menus, header icons
  // =====================================================================
  const ROUTE_OF = { 'Enroll a Patient': '#pending', 'Patient Summary Page': '#summary', 'Patient Record': '#record', 'Manual Enrollment': '#registration', 'Query Reports': '#query?r=245',
    'Patient Contact Report': '#query?r=245', 'Weight Management Report': '#query?r=246', 'Blood Glucose Report': '#query?r=247', 'Non-Adherence Call Report': '#query?r=248', 'Monthly Compliance Report': '#query?r=249',
    'Care Coordinator Enrollment/Census Report': '#query?r=250', 'Red Alert Report': '#query?r=251', 'Task Report': '#tasks', 'Pending Enrollment Report': '#pending', 'Status Report': '#status', 'Non Responder Report': '#nonresponder',
    'Health Data Analysis': '#hda', 'Create New User': '#newuser', 'Manage Users': '#users', 'Manage VISN/Site': '#visnsite', 'Device Management': '#devices', 'Manage Announcements': '#announcements', 'Cross Coverage': '#crosscoverage' };
  $('menuNav').addEventListener('click', e => {
    const a = e.target.closest('.subMenu a'); if (!a || a.getAttribute('href') || a.parentElement.classList.contains('hasSub')) return;
    const t = a.textContent.trim(); document.querySelectorAll('.menuNav .top.open').forEach(x => x.classList.remove('open'));
    if (/^(COG|Cog|VHA)/.test(t)) { location.hash = '#library?doc=' + encodeURIComponent(t); return; }
    if (t.startsWith('Customer Service')) return msgBox('Customer Service: (877) 664-9848\nMonday - Friday', 'Help');
    if (t === 'Customer Support Email') return msgBox('Opens an email to CareConsole customer support. (Not part of this mockup.)', 'Help');
    if (t === 'Learning Center') return msgBox('Opens the vendor Learning Center in a new window. (Not part of this mockup.)', 'Help');
  });
  $('imgLogo').onclick = () => { location.hash = '#dashboard'; };
  $('collapseTab').onclick = () => { document.body.classList.toggle('panelHidden'); $('collapseTab').innerHTML = document.body.classList.contains('panelHidden') ? '&#9660;' : '&#9650;'; };
  const ddl = $('ddlPatient');
  [...patients].sort((a, b) => a.name.localeCompare(b.name)).forEach(p => ddl.add(new Option(p.name, p.id)));
  ddl.value = store.getItem('ccSelectedPatient') || '';
  ddl.onchange = () => { if (ddl.value) store.setItem('ccSelectedPatient', ddl.value); else store.removeItem('ccSelectedPatient'); route(); };
  $('lnkRefresh').onclick = () => toast('Patient list refreshed');
  $('lnkTopReset').onclick = () => { ddl.value = ''; store.removeItem('ccSelectedPatient'); route(); };
  // Header icons: message center, tasks, pending patients, disenrollment
  const icons = document.querySelectorAll('.menuIcons span');
  const pendCounts = () => [PEND.filter(x => x.state === 'Ready to Enroll').length, PEND.filter(x => x.days >= 5).length, PEND.filter(x => x.delivery === 'Delivered').length];
  icons[0].onclick = () => popup(`<h2>Message Center</h2><p>Select option below</p><p><a class="lnk" id="mcAnn">Create Announcement/Reminder</a></p><p><a class="lnk" id="mcQ">Create Question</a></p><p><a class="lnk" id="mcPrev">View Previous</a></p>`, pp => {
    pp.querySelector('#mcAnn').onclick = () => msgCreate('Reminder'); pp.querySelector('#mcQ').onclick = () => msgCreate('Question');
    pp.querySelector('#mcPrev').onclick = () => popup(`<h2>Previous Announcements/Reminders</h2><table class="grid"><tr><th>Date</th><th>Type</th><th>Patient</th><th>Message</th></tr>${MSGS.map(m => `<tr><td>${m.date}</td><td>${m.kind}</td><td>${m.pt === 'all' ? 'All Patients' : esc(byId[m.pt].name)}</td><td>${esc(m.text)}</td></tr>`).join('')}</table><div class="foot"><button class="btnBlue" data-close>Close</button></div>`);
  });
  function msgCreate(kind) {
    popup(`<h2>Create ${kind === 'Question' ? 'Question' : 'Announcement/Reminder'}</h2><label class="f">Type</label><select id="mcK">${opts(kind === 'Question' ? ['Question'] : ['Reminder', 'Announcement'], kind)}</select>
      <label class="f">Send To</label><select id="mcP"><option value="all">All my patients</option>${patients.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
      <label class="f">${kind === 'Question' ? 'Question (answered Yes / No)' : 'Message'}</label><textarea id="mcT"></textarea><label class="f">Deliver On</label><input type="date" id="mcD" value="${iso(TODAY)}">
      <div class="foot"><button class="btnOutline" data-close>Cancel</button><button class="btnBlue" id="mcSave">Save</button></div>`,
      pp => pp.querySelector('#mcSave').onclick = () => { const t = pp.querySelector('#mcT').value.trim(); if (!t) return msgBox('Please enter the message.'); MSGS.push({ id: 'm' + Date.now(), kind: pp.querySelector('#mcK').value, pt: pp.querySelector('#mcP').value, text: t, date: mmddyyyy(fromIso(pp.querySelector('#mcD').value) || TODAY), by: 'Borne, Ben' }); saveMsgs(); closePop(); toast(`${kind} saved`); route(); });
  }
  icons[1].onclick = () => { location.hash = '#tasks'; };
  icons[1].querySelector('.badge').textContent = TASKS.filter(t => t.status === 'Not Completed' && fromIso(t.due) <= TODAY).length;
  const pc = pendCounts();
  icons[2].querySelector('.badge').textContent = PEND.length;
  const dd = document.createElement('div'); dd.className = 'ddMenu'; dd.innerHTML = `<a href="#pending?state=Ready to Enroll">You have ${pc[0]} patients pending enrollment</a><a href="#pending?state=Pending more than 5+ days">You have ${pc[1]} patients pending 5+ days</a><a href="#pending">You have ${pc[2]} pending patients that have received kits/devices</a>`;
  document.body.appendChild(dd);
  icons[2].onclick = e => { e.stopPropagation(); dd.classList.toggle('open'); };
  document.addEventListener('click', () => dd.classList.remove('open'));
  icons[3].onclick = () => msgBox('You have 0 patient(s) that need a Disenrollment Reason', 'Disenrollment Reason');
  icons[0].dataset.tip = 'Message centre to create and view announcements &amp; questions'; icons[1].dataset.tip = 'All Assigned Task'; icons[2].dataset.tip = 'Status of pending patients'; icons[3].dataset.tip = 'Disenrollment reason popup';
  document.querySelector('.logout').onclick = () => msgBox('Log Out ends the CareConsole session. (In this mockup you stay signed in.)', 'Log Out');

  function route() {
    const h = location.hash.slice(1) || 'dashboard', [name, qs] = h.split('?'), q = Object.fromEntries(new URLSearchParams(qs || ''));
    const fn = ROUTES[name] || ROUTES.dashboard;
    ddl.value = store.getItem('ccSelectedPatient') || '';
    closePop(); window.scrollTo(0, 0);
    const title = fn(q) || 'CareConsole';
    document.title = `${title} - CareConsole® Care Coordinator Web Viewer`;
    window.ccNav = { type: 'cc-nav', title: document.title, path: '/' + ({ dashboard: 'LandingPage', summary: 'PatientSummary', record: 'PatientRecord', pending: 'PendingReport', registration: 'Registration1', tasks: 'TasksReport', status: 'ClientStatusReport2', nonresponder: 'NonAdherenceReport', hda: 'VitalReadings', query: 'ReportViewer', users: 'ManageUsers', newuser: 'UserManagement', visnsite: 'ManageVisnSite', devices: 'PatientListServiceSearch', device: 'PatientDeviceManagement', announcements: 'ManageAnnouncements', crosscoverage: 'CrossCoverage', library: 'Library' }[name] || 'LandingPage') + '.aspx' };
    try { parent.postMessage(window.ccNav, '*'); } catch { }
  }
  addEventListener('hashchange', route);
  route();

})();
</script>
</body>
</html>
