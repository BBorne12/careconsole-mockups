  let dateDir = 1;

          + sec('Images', `<div class="thumbs"><div title="${stamp(TODAY_I - 2, '10:12', '40')}" data-img>${mdyS(TODAY_I - 2)}</div><div title="${stamp(TODAY_I - 9, '9:58', '02')}" data-img>${mdyS(TODAY_I - 9)}</div></div>`, '', true);

  // ---------- Graph popup (the original used an ActiveX control) ----------
  const TOD = [['All day', 0, 24], ['Early morning', 0, 6], ['Morning', 6, 10], ['Noon', 10, 15], ['After noon', 15, 18], ['Evening', 18, 21], ['Night', 21, 24]];
  function graph(p, type, a, b) {
    let tod = 0, zoom = 1, bar = false;
    const keys = type === 'Blood Pressure' ? ['Systolic', 'Diastolic', 'Pulse'] : [type], colors = ['#000', '#0000cc', '#8b008b'];
    const draw = () => {
      const [, h1, h2] = TOD[tod];
      const pts = data(p).V.filter(x => x.type === type && x.i >= a && x.i <= b && +x.t.split(':')[0] >= h1 && +x.t.split(':')[0] < h2);
      const all = pts.flatMap(x => keys.map(k => x.vals[k])), W = Math.max(560, 560 * zoom), H = 230, Lm = 10, R = 50, T = 10, B = 26;
      if (!pts.length) return `<div style="padding:30px">No readings for this period and time of day.</div>`;
      const lo = Math.floor(Math.min(...all) * 0.95), hi = Math.ceil(Math.max(...all) * 1.05);
      const x = i => Lm + (W - Lm - R) * (b === a ? 0.5 : (i - a) / (b - a)), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo || 1));
      let g = `<svg width="${W}" height="${H}"><rect x="${Lm}" y="${T}" width="${W - Lm - R}" height="${H - T - B}" fill="#fff" stroke="#999"/>`;
      for (let k = 0; k <= 5; k++) { const v = lo + (hi - lo) * k / 5; g += `<line x1="${Lm}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#ddd"/><text x="${W - R + 4}" y="${y(v) + 3}">${Math.round(v)} ${type === 'Weight' ? 'Lbs' : type === 'Blood Oxygen' ? '%' : 'mmHg'}</text>`; }
      for (let i = a; i <= b; i += Math.max(1, Math.round((b - a) / (8 * zoom)))) { const d = dayDate(i); g += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - B}" stroke="#eee"/><text x="${x(i)}" y="${H - B + 12}" text-anchor="middle">${pad(d.getMonth() + 1)}/${pad(d.getDate())}/${String(d.getFullYear()).slice(2)}</text>`; }
      keys.forEach((k, j) => {
        if (!bar) g += `<polyline fill="none" stroke="${colors[j]}" points="${pts.map(q => `${x(q.i)},${y(q.vals[k])}`).join(' ')}"/>`;
        pts.forEach(q => { const c = { H: '#f00', M: '#ee0', L: '#090' }[q.risk[k]] || '#00f'; g += bar ? `<rect x="${x(q.i) - 3 + j * 3}" y="${y(q.vals[k])}" width="3" height="${H - B - y(q.vals[k])}" fill="${c}"><title>${k} ${q.vals[k]} ${stamp(q.i, q.t, q.sec)}</title></rect>` : `<circle cx="${x(q.i)}" cy="${y(q.vals[k])}" r="3.5" fill="${c}" stroke="#333"><title>${k} ${q.vals[k]} ${stamp(q.i, q.t, q.sec)}</title></circle>`; });
      });
      const k0 = pts.map(q => q.vals[keys[0]]);
      return `<div style="display:flex;gap:10px;align-items:center;font:11px Tahoma;margin-bottom:4px"><a class="lk" id="gBar" title="Bar / line graph">${bar ? '&#128200;' : '&#128202;'}</a><b>${type} ${mdyS(a)}-${mdyS(b)} ${TOD[tod][0] === 'All day' ? 'All readings' : TOD[tod][0]}</b>
        <span>High ${Math.max(...k0).toFixed(2)}</span><span>Low ${Math.min(...k0).toFixed(2)}</span><span>Average ${(k0.reduce((s, v) => s + v, 0) / k0.length).toFixed(2)}</span>${keys.length > 1 ? keys.map((k, j) => `<span style="color:${colors[j]}">&#9632; ${k}</span>`).join('') : ''}</div>
        <div style="overflow-x:auto;width:620px" class="gr">${g}</svg></div>`;
    };
    popup(`Graph - ${type}`, `${patInfo(p).replace('</div></div>', '</div></div>')}<div class="noprint" style="text-align:right;margin:2px 0"><a class="lk" onclick="print()">&#128424;</a></div><div id="gBody">${draw()}</div>
      <div class="noprint" style="display:flex;gap:6px;justify-content:flex-end;margin-top:4px"><button class="btn g" id="gMeas">Measurements...</button><button class="btn g" id="gIn">Zoom +</button><button class="btn g" id="gOut">Zoom &minus;</button></div>`, (bd) => {

    const s = $('adSave'); if (s) s.onclick = () => { const n = $('adN').value.trim(); if (!n) return say('Please enter a name.'); if (!d && [...GLOBAL_DIS, ...DB.diseases].includes(n)) return say('This disease already exists.'); if (!d) DB.diseases.push(n); save(); go('adis', { dn: n }); };
    const dl = $('adDel'); if (dl) dl.onclick = () => { if (PTS.some(p => p.diseases.includes(d))) return say('This disease cannot be deleted because it is assigned to a patient.'); DB.diseases = DB.diseases.filter(x => x !== d); save(); go('adis', { dn: '' }); };
  }
  function hwList() { return [...PTS.map(p => ({ serial: p.serial, type: p.monitor, tz: 'Server Time', pt: nm(p) })), ...DB.hardware]; }
  function viewAHw() {
    const h = hwList().find(x => x.serial === S.hw), t = S.hwt || 'V100';
    $('main').innerHTML = `<div class="bar"><b>Monitor</b> ${sel('hwSel', [['', '-Add New Monitor-'], ...hwList().map(x => [x.serial, `${x.serial} [${x.type}]`])], S.hw || '')}</div>
      ${sec('Hardware Information', h ? `<table class="d"><tr><td><b>*Monitor type</b></td><td>${h.type}</td></tr><tr><td><b>*Serial number</b></td><td>${h.serial}</td></tr><tr><td><b>*Monitor time</b></td><td>${sel('hwTz', ['Server Time', 'Eastern Standard', 'Central Standard', 'Mountain Standard', 'Pacific Standard'], h.tz)}</td></tr></table><div style="margin-top:4px">Patient(s) assigned to the monitor: ${esc(h.pt || 'None')}</div>`
        : `<div class="bar"><b>*Monitor type</b> ${sel('hwT', [['', '-Select Type-'], 'V100', 'V500', 'V200', 'Viterion Link'], t)}</div>${t === 'Viterion Link' ? '<div class="bar"><b>*Serial number</b> <input id="hwS" maxlength="12" size="14"></div>' : `${t === 'V200' ? '' : `<div class="bar"><b>*First letter of serial number</b> ${sel('hwF', [['', '-Select First Letter-'], 'A', 'B', 'C', 'D', 'E'])}</div>`}<div class="bar"><b>*Last 6 digits of serial number</b> <input id="hwS" maxlength="6" size="8"></div>${t === 'V200' ? '<div class="bar"><b>*ID</b> <input id="hwI" maxlength="12" size="14"></div>' : ''}`}<div class="bar"><b>*Monitor time</b> ${sel('hwTz', ['Server Time', 'Eastern Standard', 'Central Standard', 'Mountain Standard', 'Pacific Standard'], 'Server Time')}</div>`)}
      <div style="text-align:center"><button class="btn p" id="hwSave">Save</button> ${h && !h.pt ? '<button class="btn p" id="hwDel">Delete</button>' : ''}</div><div class="hint">V500 Kiosks are added automatically. A monitor assigned to a patient cannot be deleted.</div>`;
    $('hwSel').onchange = e => go('ahw', { hw: e.target.value });
    const ty = $('hwT'); if (ty) ty.onchange = e => go('ahw', { hw: '', hwt: e.target.value });
    $('hwSave').onclick = () => {
      if (h) { const x = DB.hardware.find(y => y.serial === h.serial); if (x) x.tz = $('hwTz').value; save(); return say('The monitor was saved.'); }
      const tt = $('hwT').value, s = $('hwS').value.trim(); if (!tt) return say('Please select a monitor type.');
      if (tt === 'Viterion Link' ? !/^[A-Za-z0-9]{12}$/.test(s) : !/^\d{6}$/.test(s)) return say(tt === 'Viterion Link' ? 'The serial number must be 12 letters or digits.' : 'Please enter the last 6 digits of the serial number.');
      if ($('hwF') && !$('hwF').value) return say('Please select the first letter of the serial number.');
      if (hwList().some(x => x.serial === s)) return say('This monitor is already registered.');
      DB.hardware.push({ serial: s, type: tt, tz: $('hwTz').value, pt: '' }); save(); go('ahw', { hw: s });
    };
    const dl = $('hwDel'); if (dl) dl.onclick = () => { DB.hardware = DB.hardware.filter(x => x.serial !== h.serial); save(); go('ahw', { hw: '' }); };
  }
  function viewADemo() {
    const p = byId[S.pid];
    const list = DB.adminView === 'del' ? PTS.filter(x => x.deleted) : PTS.filter(x => !x.deleted);
    const f = (k, l, req, val, w) => `<div${w ? ' style="grid-column:span 2"' : ''}><span class="fl">${req ? '*' : ''}${l}</span><input type="text" data-f="${k}" value="${esc(val ?? '')}" ${p ? '' : ''}></div>`;
    const allDis = [...GLOBAL_DIS, ...DB.diseases].sort();
    $('main').innerHTML = `<div class="bar"><b>Patient name</b> ${sel('dmSel', [['', '-Add New Patient-'], ...list.map(x => [x.id, nm(x)])], S.pid || '')}</div>
      ${sec('Personal Information', `<div class="g3">${f('first', 'First name', 1, p?.first)}<div><span class="fl">Middle name</span><input type="text"></div>${f('last', 'Last name', 1, p?.last)}
        <div><span class="fl">*Gender</span>${sel('dmG', [['', '-Select Gender-'], 'Male', 'Female'], p?.gender || '')}</div><div><span class="fl">*Date of birth</span><input type="text" data-f="dob" id="dmDob" value="${p?.dob || ''}" size="10"> <button class="btn g" data-cal="dmDob">Calendar</button></div><div></div>
        ${f('addr', 'Address', 1, p?.addr, 1)}${f('city', 'City', 1, p?.city)}<div><span class="fl">*State</span>${sel('dmSt', [['', '-Select State-'], 'IL', 'IN', 'IA', 'MO', 'WI'], p?.st || '')}</div>${f('zip', 'Zip code', 1, p?.zip)}${f('ssn', 'SSN', 0, p?.ssn)}
        ${f('phone', 'Phone', 1, p?.phone)}<div><span class="fl">Secondary Phone</span><input type="text"></div>${f('pid', 'ID', 1, p?.pid)}<div style="grid-column:span 2"><span class="fl">Email</span><input type="text" style="width:96%"></div><div><span class="fl">*Language</span>${sel('dmLang', ['Chinese', 'English', 'French', 'Russian', 'Spanish'], p?.language || 'English')}</div>
        <div style="grid-column:span 2"><span class="fl">Comments</span><textarea id="dmCom" rows="2" style="width:96%" maxlength="500">${esc(p?.comments || '')}</textarea></div><div><span class="fl">*Program of care</span>${sel('dmProg', DB.programs.map(x => x.name), p?.program || 'NA')}</div></div>`)}
      ${sec('Emergency contact information', `<div class="g3"><div><span class="fl">Primary Name</span><input type="text"></div><div><span class="fl">Phone</span><input type="text"></div><div><span class="fl">Relationship</span><input type="text"></div><div><span class="fl">Pharmacy Name</span><input type="text"></div><div><span class="fl">Pharmacy Phone</span><input type="text"></div><div></div><div><span class="fl">Doctor Name</span><input type="text"></div><div><span class="fl">Doctor Phone</span><input type="text"></div></div>`, '', true)}
      ${sec('Diseases', `<div class="g3">${allDis.map(d => `<label><input type="checkbox" data-dis="${esc(d)}" ${p?.diseases.includes(d) ? 'checked' : ''}> ${esc(d)}</label>`).join('')}</div>`)}
      ${sec('Clinician List', shuttle('dmC', DB.clinicians.map(c => `${c.last}, ${c.first}`).filter(n => !(p?.clinicians || []).includes(n)).map(n => [n, n]), (p?.clinicians || []).map(n => [n, n])) + '<div class="hint">Clinicians in the Email list receive high-risk email alerts.</div>')}
      <div style="text-align:center">${DB.adminView === 'del' ? '<button class="btn p" id="dmUndel">Undelete and Save</button>' : `<button class="btn p" id="dmSave">Save</button> <button class="btn p" id="dmSaveMon">Save and assign monitor</button> ${p ? '<button class="btn p" id="dmDel">Delete</button>' : ''}`}</div>`;
    $('dmSel').onchange = e => go('ademo', { pid: e.target.value });
    const doSave = next => {
      const v = k => $('main').querySelector(`[data-f="${k}"]`).value.trim();
      for (const [k, l] of [['first', 'First name'], ['last', 'Last name'], ['addr', 'Address'], ['city', 'City'], ['zip', 'Zip code'], ['phone', 'Phone'], ['pid', 'ID']]) if (!v(k)) return say(`${l} is required.`);
      if (!$('dmG').value || !$('dmSt').value) return say('Gender and State are required.'); if (parse(v('dob')) == null) return say('Please enter the date of birth as MM/DD/YYYY.');
      if (v('ssn') && !/^\d{9}$/.test(v('ssn'))) return say('SSN must be 9 digits without hyphens.');
      if (/"/.test($('dmCom').value)) return say('Comments cannot contain double quotes.');
      const cl = assigned('dmC'); if (!cl.length) return say('Please assign at least one clinician.');
      if (!p) return say('Adding new patients is not part of this simulation: the nine demonstration patients come from VistA. Select an existing patient to edit.');
      const d = (DB.patients[p.id] ||= {}); Object.assign(d, { clinicians: cl, email: cl, diseases: [...$('main').querySelectorAll('[data-dis]:checked')].map(c => c.dataset.dis), language: $('dmLang').value, program: $('dmProg').value, comments: $('dmCom').value }); Object.assign(p, d);
      (DB.hist[p.id] ||= []).push({ date: nowStamp(), field: 'Demographics', old: 'N/A', nw: 'Updated', name: 'Administrator' }); save();
      if (next) go('amon', { pid: p.id }); else { render(); say('The patient was saved.'); }
    };
    const s = $('dmSave'); if (s) { s.onclick = () => doSave(false); $('dmSaveMon').onclick = () => doSave(true); }
    const dl = $('dmDel'); if (dl) dl.onclick = () => { if (!confirm('Delete this patient?')) return; (DB.patients[p.id] ||= {}).deleted = true; p.deleted = true; save(); go('ademo', { pid: '' }); };
    const ud = $('dmUndel'); if (ud) ud.onclick = () => { if (!p) return say('Please select a patient.'); DB.patients[p.id].deleted = false; p.deleted = false; save(); DB.adminView = 'all'; save(); go('ademo', { pid: p.id }); say('The patient was restored.'); };
  }
  function viewAMon() {
    const p = byId[S.pid];
    let html = `<div class="bar"><b>Patient name</b> ${ptSel('mnP', S.pid, '-Select Patient-', PTS.filter(x => !x.deleted))}</div>`;
    if (p) {
      const V = ['Blood Glucose', 'Blood Oxygen', 'Blood Pressure', 'Fluid Level', 'Pain', 'Peak Flow', 'PT/INR', 'Temperature', 'Weight'];
      const dev = { 'Blood Glucose': ['Manual Input Type', 'Bayer/Ascensia CONTOUR', 'Roche/Accu-Chek Aviva', 'Abbott/FreeStyle'], 'Blood Oxygen': ['Nonin/i-pod', 'BCI/OXIMETER'], 'Blood Pressure': ['A&D medical/UA-767PC', 'Manual Input Type'], Weight: ['A&D medical/UC-321', 'A&D Medical/UC-321PL', 'Manual Input Type'], Pain: ['Pain Rating (0-10 Scale)', 'Face 0-5', 'Face 0-10'], Temperature: ['Manual Input Type'], 'Peak Flow': ['Manual Input Type'], 'Fluid Level': ['Manual Input Type'], 'PT/INR': ['Manual Input Type (INR/PT)'] };
      html += sec('Assigned Monitors', `Viterion ${p.monitor.slice(1)} serial number: ${p.serial} &nbsp; <a class="lk">Modify</a> &nbsp; <a class="lk" id="mnUn">Unassign Monitor</a><div class="bar"><b>Add/Update Monitor</b> ${sel('mnAdd', ['- Add/Update Monitor -', 'Viterion 100', 'Viterion 200', 'Viterion 500', 'Viterion 500 Kiosk', 'Viterion Link'], '- Add/Update Monitor -')}</div>`)
        + sec('Vital Signs', `<table class="d">${V.map(v => `<tr><td><label><input type="checkbox" data-v="${v}" ${p.vitals.includes(v === 'Pain' ? 'Pain Rating' : v) ? 'checked' : ''}> ${v}</label></td><td>${sel('', dev[v] || ['Manual Input Type'], '')}</td><td>${v === 'Temperature' ? '<label><input type="radio" name="tu" checked> F</label> <label><input type="radio" name="tu"> C</label>' : v === 'Weight' ? '<label><input type="radio" name="wu" checked> Lbs</label> <label><input type="radio" name="wu"> KG</label>' : ''}</td></tr>`).join('')}
          <tr><td><b>Questions</b></td><td>${sel('mnQ', ['No Question', ...GROUPS()], qOf(p))}</td><td></td></tr><tr><td><b>Question Calendar</b></td><td>${sel('mnQC', ['No Question Calendar', ...DB.calendars.map(c => c.name)], 'No Question Calendar')}</td><td></td></tr></table>`)
        + sec('Monitors', `<div class="bar"><b>Select Monitor</b> ${sel('mnSel', [p.serial, ...DB.hardware.filter(h => !h.pt).map(h => h.serial)], p.serial)}</div><div><b>Monitor login information</b></div><div class="bar"><b>*Screen name</b> <input id="mnSN" value="${esc(p.screen)}"> <b>Passcode</b> <input id="mnPC" size="10" maxlength="10" type="password" value="1234"></div><div class="bar"><b>Sound</b> <button class="btn" id="mnSearch">Search</button> <b>Select</b> ${sel('mnSnd', ['- Select Sound -'], '')} <button class="btn" id="mnPlay">Play</button></div>`)
        + `<div style="text-align:center"><button class="btn p" id="mnSave">Save</button> <button class="btn p" id="mnSaveL">Save and Set Limits</button></div><div class="hint">The setup downloads to the monitor the next time it is restarted and connects.</div>`;
    }
    $('main').innerHTML = html;
    $('mnP').onchange = e => go('amon', { pid: e.target.value });
    if (!p) return;
    $('mnSearch').onclick = () => { $('mnSnd').innerHTML = `<option>- Select Sound -</option><option>${esc($('mnSN').value)}</option><option>${esc($('mnSN').value)} 2</option>`; };
    $('mnPlay').onclick = () => say('Recorded name greetings are not part of this simulation.');
    $('mnUn').onclick = () => say('Unassigning monitors is not part of this simulation.');
    const doSave = next => { if (!$('mnSN').value.trim()) return say('Please enter a screen name.'); if ($('mnPC').value && !/^\d{1,10}$/.test($('mnPC').value)) return say('The passcode must be 1 to 10 digits.');
      const d = (DB.patients[p.id] ||= {}); d.screen = $('mnSN').value.trim(); d.question = $('mnQ').value; d.vitals = [...$('main').querySelectorAll('[data-v]:checked')].map(c => c.dataset.v === 'Pain' ? 'Pain Rating' : c.dataset.v); Object.assign(p, { screen: d.screen, vitals: d.vitals });
      (DB.hist[p.id] ||= []).push({ date: nowStamp(), field: 'Monitor setup', old: 'N/A', nw: 'Updated', name: 'Administrator' }); save(); clearCache(); if (next) go('limits', { pid: p.id }); else say('The monitor setup was saved.'); };
    $('mnSave').onclick = () => doSave(false); $('mnSaveL').onclick = () => doSave(true);
  }
  function viewAHist() {
    const p = byId[S.pid];
    const base = p ? [{ date: '1/2/2026 10:15:00 AM', field: 'Monitor screen name', old: 'N/A', nw: p.first, name: 'Administrator' }, { date: '1/2/2026 10:16:12 AM', field: 'Weight', old: 'N/A', nw: 'A&D medical/UC-321', name: 'Administrator' }] : [];
    $('main').innerHTML = `<div class="bar"><b>Patient name</b> ${ptSel('ahP', S.pid, '-Select Patient-', PTS)}</div>${p ? `<table class="d"><tr><th><a class="lk">&#9660; Date</a></th><th>Field</th><th>Old</th><th>New</th><th>Name</th></tr>${[...base, ...(DB.hist[p.id] || [])].reverse().map(h => `<tr><td>${h.date}</td><td>${h.field}</td><td>${h.old}</td><td>${esc(h.nw)}</td><td>${esc(h.name)}</td></tr>`).join('')}</table>` : ''}`;
    $('ahP').onchange = e => go('ahist', { pid: e.target.value });
  }
  function viewATemplate() {
    const t = DB.templates.find(x => x.name === S.tn);
    $('main').innerHTML = `<div class="bar"><b>Language</b> ${sel('tL', ['English', 'Spanish'], 'English')}<span style="flex:1"></span><button class="btn p" id="tSave">Save</button></div><div class="bar"><b>Schedule Template</b> ${sel('tSel', [['', '-Add New Template-'], ...DB.templates.map(x => x.name)], S.tn || '')}</div>
      <div class="bar"><b>*Name</b> <input id="tN" value="${esc(t ? t.name : '')}"></div>${shuttle('tA', [...ACTS, ...GROUPS().map(g => g + ' (Group)')].filter(a => !(t && t.items.includes(a))).map(a => [a, a]), t ? t.items.map(a => [a, a]) : [])}
      ${t ? `<table class="d" style="margin-top:6px">${t.items.map(a => `<tr><td style="width:160px">${esc(a)}</td><td><textarea class="mono" rows="1" cols="50">${esc(defMsg(a))}</textarea></td></tr>`).join('')}</table>` : ''}<div class="hint">Up to 10 activities: vital signs, messages, one question calendar and up to three question groups. For Viterion 100 monitors (software 2.1 or later).</div>`;
    $('tSel').onchange = e => go('atemplate', { tn: e.target.value });
    $('tSave').onclick = () => { const n = $('tN').value.trim(), items = assigned('tA'); if (!n) return say('Please enter a name.'); if (!items.length) return say('Please assign at least one activity.'); if (items.length > 10) return say('A template can have at most 10 activities.'); if (items.filter(a => a.endsWith('(Group)')).length > 3) return say('A template can have at most three question groups.'); DB.templates = DB.templates.filter(x => x !== t && x.name !== n).concat({ name: n, items }); save(); go('atemplate', { tn: n }); };
  }
  function viewAProg() {
    const g = DB.programs.find(x => x.name === S.pg);
    $('main').innerHTML = `<div class="bar"><b>Program of care</b> ${sel('pgSel', [['', '-Add New Program -'], ...DB.programs.map(x => x.name)], S.pg || '')}</div>${sec('Program information', `<div class="bar"><b>*Name</b> <input id="pgN" maxlength="50" value="${esc(g ? g.name : '')}"> <b>Description</b> <input id="pgD" maxlength="100" size="45" value="${esc(g ? g.desc : '')}"></div>`)}<div style="text-align:center"><button class="btn p" id="pgSave">Save</button> ${g ? '<button class="btn p" id="pgDel">Delete</button>' : ''}</div>`;
    $('pgSel').onchange = e => go('aprog', { pg: e.target.value });
    $('pgSave').onclick = () => { const n = $('pgN').value.trim(); if (!n) return say('Please enter a name.'); DB.programs = DB.programs.filter(x => x !== g && x.name !== n).concat({ name: n, desc: $('pgD').value.trim() }); save(); go('aprog', { pg: n }); };
    const dl = $('pgDel'); if (dl) dl.onclick = () => { if (PTS.some(p => p.program === g.name)) return say('This program cannot be deleted because it is assigned to patients.'); DB.programs = DB.programs.filter(x => x !== g); save(); go('aprog', { pg: '' }); };
  }

  function help() {
    const H = { home: 'Home lists your patients sorted by risk. Vitals and the four question categories are colored High (red), Moderate (yellow) or Low (green); a blue square means limits are not set. Compliance shows whether all scheduled data arrived. Click a name to open the Report.',
      report: 'Choose a patient and date range and click Run Report. Each reading is colored by the limits in effect when it arrived. Click Graph for a trend, or the Date heading to change the sort order.',
      newalerts: 'High-risk readings and answers create alerts. Check one or more alerts (or patients), type a comment and click Add Comment to close them. Comments cannot be changed.',
      limits: 'Set the normal range and the moderate margins for each vital sign, then click Save All. Changes apply only to data received afterwards.' };
    popup('ENET Help', `<div style="width:460px;font:12px Tahoma,Arial;line-height:1.5">${esc(H[S.page] || 'Help for this page summarizes the vendor guide. Use the tabs to move between pages; most pages start by choosing a patient.')}<p class="simTag">Help text is a short summary written for this simulation.</p></div>`);
  }

  // ===================================================================
  //  Render
  // ===================================================================
  const VIEWS = { home: viewHome, report: viewReport, query: viewQuery, notes: () => viewNotes(false), bulletin: () => viewNotes(true), newalerts: viewNewAlerts, alerthist: viewAlertHist,
    advice1: () => viewAdvice('single'), advicem: () => viewAdvice('multi'), advicehist: () => viewAdvice('hist'), limits: viewLimits, sched: () => viewSchedule(false), schedgroup: () => viewSchedule(true), autoconnect: viewAutoConnect,
    q1: viewQ1, qm: viewQm, qcal: viewQCal, pw: viewPw, viewpts: () => viewViews(false),
    ahome: viewAHome, aclin: viewAClin, adis: viewADis, ahw: viewAHw, ademo: viewADemo, amon: viewAMon, ahist: viewAHist, aquestion: viewAQuestion, agroup: viewAGroup, atemplate: viewATemplate, aviews: () => viewViews(true), aprog: viewAProg };
  function render() {
    renderTabs();
    if (!S.auth) viewLogin(); else (VIEWS[S.page] || viewHome)();
    const path = !S.auth ? `/enet/${S.screen === 'admin' ? 'Admin' : 'Staff'}Login.asp` : `/enet/${S.screen === 'admin' ? 'Admin' : 'Staff'}${S.page[0].toUpperCase() + S.page.slice(1)}.asp${S.pid ? '?PatientCode=' + (byId[S.pid]?.pid || '') : ''}`;
    window.ccNav = { path };
    try { parent.postMessage({ type: 'cc-nav', path, title: 'ENET - TeleHealthcare Network' }, '*'); } catch { }
  }
  render();
})();
</script>
</body>
</html>
