  used to order products and services from the VA Denver Acquisition & Logistics
  Center (DALC). Screens follow the public ROES 3.0*4 User Manual (VA Software
  Document Library). Not connected to the DALC; all patients, items, prices and
  order numbers are synthetic.

<style>

    dr.disab.forEach((d, i) => { if (d.station !== rec.disab[i].station) changes.push(`${d.code} eligibility station changed to ${d.station}`); });

    if (S.page === 'login' && e.target.closest('.who')) { e.preventDefault(); loginSubmit(); }
  });
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled || el.classList.contains('dis')) return; e.preventDefault(); act(el.dataset.act, el); });

  async function leaveOrder() {
    const pending = (S.cart.length && !S.submitted) || (S.devCart && S.devCart.length && !S.devDone);
    if (pending && !await msg('You have not submitted your order – click ok to exit anyway!', { confirm: true })) return false;
    S.cart = []; S.devCart = null; S.submitted = false; S.devDone = false; S.form = null; S.dev = null; S.recDraft = null;
    return true;
  }
  const ORDER_PAGES = ['commodity', 'special', 'summary', 'address', 'devreg', 'devsum', 'stock'];

  async function act(a, el) {
    if (a.startsWith('na:')) { if (ORDER_PAGES.includes(S.page) && !await leaveOrder()) return; return go('na', { what: a.slice(3) }); }
    switch (a) {
      case 'loginSubmit': return loginSubmit();
      case 'restart': return start();
      case 'exit':
        if (ORDER_PAGES.includes(S.page) && !await leaveOrder()) return;
        go('exit'); try { parent.postMessage({ type: 'roes-exit' }, '*'); } catch { } return;
      case 'history': if (ORDER_PAGES.includes(S.page) && !await leaveOrder()) return; S.recDraft = null; return go('history', { proc: true, pg: 0 });
      case 'proc': return go('history', { proc: true, pg: 0 });
      case 'unproc': return go('history', { proc: false, pg: 0 });
      case 'hpage': { const n = ptOrders(S.pt.id).filter(o => o.proc === (S.p.proc !== false)).length, pg = Math.min(Math.max(0, (S.p.pg || 0) + +el.dataset.d), Math.max(0, Math.ceil(n / PER) - 1)); return go('history', { ...S.p, pg }); }
      case 'detail': return go('detail', { no: el.dataset.no, from: S.page, fromP: S.p });
      case 'back': return S.p.from ? go(S.p.from, S.p.fromP) : go(S.pt ? 'history' : 'station');
      case 'cancelOrder': return cancelOrder(el.dataset.no);
      case 'chaSubmit': return chaSubmit();
      case 'printForm': return msg('The vendor order form would print here. Printing order forms is not part of this simulation.', { icon: 'info' });
      case 'cal': {
        const target = el.dataset.for.startsWith('chaIssue') ? document.querySelector(`.chaIssue[data-i="${el.dataset.for.slice(8)}"]`) : $(el.dataset.for);
        const pick = document.createElement('input'); pick.type = 'date'; pick.style.cssText = 'position:fixed;opacity:0;pointer-events:none;left:' + el.getBoundingClientRect().left + 'px;top:' + el.getBoundingClientRect().bottom + 'px';
        const d0 = parseDate(target.value); pick.value = iso(d0 || TODAY); document.body.appendChild(pick);
        pick.onchange = () => { if (pick.value) target.value = short(pick.value); pick.remove(); }; pick.onblur = () => setTimeout(() => pick.remove(), 300);
        try { pick.showPicker(); } catch { pick.remove(); msg('Type the date instead (for example T, T-3 or 06/29/2026).', { icon: 'info' }); }
        return;
      }
      // Commodity / special / stock forms
      case 'commodity': if (ORDER_PAGES.includes(S.page) && S.cartKind !== 'pt' && !await leaveOrder()) return; S.form = null; return go('commodity');
      case 'special': readForm(); { const addr = S.form.addr; S.form = Object.assign(newForm('special'), { addr, group: S.form.group, requestedBy: S.form.requestedBy, service: S.form.service, disab: S.form.disab }); } return go('special');
      case 'toCommodity': { const addr = S.form.addr; S.form = Object.assign(newForm('commodity'), { addr }); } return go('commodity');
      case 'toggleSearch': readForm(); S.form.searchOpen = !S.form.searchOpen; render(); if (S.form.searchOpen) $('fSearch').focus(); return;
      case 'doSearch': {
        readForm(); const q = S.form.search; if (!q) return msg('Enter one or more characters of the item to search for.');
        const n = (CAT[S.form.group] || []).filter(r => r[0].startsWith(q.toUpperCase()) || r[2].includes(q.toUpperCase())).length;
        if (n > 100) return msg('More than 100 items match. Please enter additional characters to narrow your search.');
        if (!n) return msg(`No items in ${S.form.group} begin with "${q}".`);
        S.form.item = ''; S.form.qty = ''; render(); return;
      }
      case 'clearSearch': readForm(); S.form.search = ''; S.form.item = ''; render(); return;
      case 'formReset': { const k = S.form.kind, addr = S.form.addr; S.form = Object.assign(newForm(k), { addr: k === 'stock' ? null : addr }); render(); return; }
      case 'formExit': {
        if (!await leaveOrder()) return;
        return S.cartKind === 'station' || S.page === 'stock' ? go('station') : go('history', { proc: true });
      }
      case 'addToOrder': return addToOrder();
      case 'summary': readForm(); return go('summary');
      case 'addAnother': S.form = null; return go(S.cartKind === 'station' ? 'stock' : 'commodity');
      case 'cartDel': S.cart.splice(+el.dataset.i, 1); return render();
      case 'cartEdit': {
        const l = S.cart[+el.dataset.i], st = S.cartKind === 'station', kind = st ? 'stock' : l.special ? 'special' : 'commodity';
        S.form = Object.assign(newForm(kind), { requestedBy: l.requestedBy, service: l.service, disab: l.disab, group: l.group, item: l.special ? '' : l.item, qty: String(l.qty), trans: l.trans[0] + l.trans.slice(1).toLowerCase(), deliv: l.deliv[0] + l.deliv.slice(1).toLowerCase(), phone: l.phone, make: l.special ? l.make : '', desc: l.special ? l.desc : '', addr: l.addr, remarks: l.remarks || '', routing: l.routing || '', deliverTo: l.deliverTo || '', editIdx: +el.dataset.i });
        return go(kind);
      }
      case 'cartSubmit': return cartSubmit();
      case 'address': readForm(); return go('address');
      case 'stationAddr': return msg('The station delivery address is recorded in the Institution file at the DALC and cannot be edited here. Use Routing Symbol and Deliver To for this order.', { icon: 'info' });
      case 'addrBack': return go(S.form.kind);
      case 'addrReset': S.form.addr = null; return render();
      case 'addrAccept': return addrAccept();
      // Device registration
      case 'devreg': if (S.page !== 'devsum' && ORDER_PAGES.includes(S.page) && !await leaveOrder()) return; S.dev = null; return go('devreg');
      case 'devsum': readDev(); return go('devsum');
      case 'devSearch': {
        readDev(); if (!S.dev.make) return msg('Select a Make first.');
        const q = prompt('Enter one or more characters of the model you are looking for:', S.dev.mq || ''); if (q === null) return;
        S.dev.mq = q.trim(); S.dev.model = ''; render(); return;
      }
      case 'devAdd': return devAdd();
      case 'devReset': S.dev = null; return render();
      case 'devDel': S.devCart.splice(+el.dataset.i, 1); return render();
      case 'devSubmit': return devSubmit();
      case 'devExit': if (!await leaveOrder()) return; return go('history', { proc: true });
      // Record updates / aids
      case 'record': S.recDraft = null; return go('record');
      case 'recToggle': { readRec(); const x = S.recDraft.aids.find(y => y.serial === el.dataset.s); x.auth = !x.auth; return render(); }
      case 'recShowUn': readRec(); S.recDraft.showUn = !S.recDraft.showUn; return render();
      case 'recReset': S.recDraft = null; return render();
      case 'recSubmit': return recSubmit();
      case 'recExit': S.recDraft = null; return go('history', { proc: true });
      case 'aids': S.aidsView = 'auth'; return go('aids');
      case 'aidsToggle': S.aidsView = S.aidsView === 'un' ? 'auth' : 'un'; return render();
      case 'pending': if (ORDER_PAGES.includes(S.page) && !await leaveOrder()) return; return go('pending');
      // Desk top
      case 'home': if (ORDER_PAGES.includes(S.page) && !await leaveOrder()) return; return go('home');
      case 'lookup': return go('lookup');
      case 'lookupGo': return lookupGo();
      case 'station': if (ORDER_PAGES.includes(S.page) && !await leaveOrder()) return; return go('station', { proc: true });
      case 'sproc': return go('station', { proc: true });
      case 'sunproc': return go('station', { proc: false });
      case 'stock': if (S.page !== 'summary' && ORDER_PAGES.includes(S.page) && !await leaveOrder()) return; if (S.cartKind !== 'station') S.cart = []; S.cartKind = 'station'; S.form = null; return go('stock');
      case 'contact': case 'whatsnew': case 'faq': case 'catalog': return go(a);
    }
  }

  start();
})();
</script>
</body>
</html>
