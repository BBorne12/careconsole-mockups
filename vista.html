<title>VistA</title>
<!--
  Simulation of a VistA roll-and-scroll terminal session: sign-on, menus,
  Home Telehealth, Scheduling (Appointment Management), Patient Inquiry,
  TIU progress notes and Consult Tracking. Prompts follow general VistA /
  FileMan conventions; the Home Telehealth menu is approximated. Not connected
  to VistA; all patients and data are synthetic. Progress notes are shared with
  the CPRS window (localStorage key "cprsNotes").
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #term { position: absolute; inset: 0; overflow-y: auto; padding: 6px 10px 10px; outline: none; cursor: text; }
  #scr { margin: 0; font: 15px/1.25 Consolas, "Lucida Console", "Courier New", monospace; color: #c8c8c8; white-space: pre; }
  #scr .rv { background: #c8c8c8; color: #000; }
  #scr .hi { color: #fff; font-weight: bold; }
  #scr .dim { color: #8a8a8a; }
  #scr .grn { color: #6fdc6f; }
  #scr .cur { background: #c8c8c8; color: #000; animation: blink 1s steps(1) infinite; }
  #term:not(:focus-within) #scr .cur, #term:not(:focus) #scr .cur { animation: none; background: transparent; outline: 1px solid #888; }
  @keyframes blink { 50% { background: transparent; color: inherit; } }
  ::selection { background: #3a5f9a; color: #fff; }
</style>
</head>
<body>
<div id="term" tabindex="0"><pre id="scr"></pre></div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const L = (s, n) => String(s ?? '').slice(0, n).padEnd(n);
  const R = (s, n) => String(s ?? '').slice(0, n).padStart(n);
  const getJson = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const setJson = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ===================================================================
  //  Terminal: screen buffer, cursor, keyboard
  // ===================================================================
  let lines = [[]];            // each line: array of [text, cls]
  const MAXLINES = 1500;
  function w(s = '', c = '') {
    String(s).split('\n').forEach((part, i) => {
      if (i > 0) { lines.push([]); if (lines.length > MAXLINES) lines.splice(0, lines.length - MAXLINES); }
      if (part) lines[lines.length - 1].push([part, c]);
    });
    paint();
  }
  const wl = (s = '', c = '') => w(s + '\n', c);
  const cls = () => { lines = [[]]; paint(); };
  function backspace() {
    const ln = lines[lines.length - 1]; if (!ln.length) return;
    const seg = ln[ln.length - 1]; seg[0] = seg[0].slice(0, -1); if (!seg[0]) ln.pop(); paint();
  }
  let painting = false;
  function paint() {
    if (painting) return; painting = true;
    requestAnimationFrame(() => {
      painting = false;
      $('scr').innerHTML = lines.map((ln, i) => ln.map(([t, c]) => c ? `<span class="${c}">${esc(t)}</span>` : esc(t)).join('') + (i === lines.length - 1 ? '<span class="cur"> </span>' : '')).join('\n');
      $('term').scrollTop = $('term').scrollHeight;
    });
  }

  let inbuf = '', wake = null;
  function keys(s) { inbuf += s; if (wake) { const f = wake; wake = null; f(); } }
  window.vistaKeys = keys; // lets the desktop (and tests) type into the session
  async function readLine(echo = true) {
    let s = '';
    for (;;) {
      while (!inbuf) await new Promise(r => { wake = r; });
      const ch = inbuf[0]; inbuf = inbuf.slice(1);
      if (ch === '\r' || ch === '\n') { w('\n'); return s; }
      if (ch === '\b') { if (s) { s = s.slice(0, -1); if (echo) backspace(); } continue; }
      if (ch >= ' ' && s.length < 245) { s += ch; if (echo) w(ch); }
    }
  }
  $('term').addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') return; if (e.ctrlKey && e.key.toLowerCase() === 'c' && getSelection().toString()) return; if (e.ctrlKey && e.key.toLowerCase() === 'c') { e.preventDefault(); keys('^\r'); } return; }
    if (e.key === 'Enter') { e.preventDefault(); keys('\r'); }
    else if (e.key === 'Backspace') { e.preventDefault(); keys('\b'); }
    else if (e.key === 'Tab') { e.preventDefault(); }
    else if (e.key.length === 1) { e.preventDefault(); keys(e.key); }
  });
  $('term').addEventListener('paste', e => { e.preventDefault(); keys((e.clipboardData.getData('text') || '').replace(/\r?\n/g, '\r')); });
  $('term').addEventListener('mouseup', () => { if (!getSelection().toString()) $('term').focus(); });
  window.addEventListener('focus', () => $('term').focus());
  function fit() { const px = Math.max(11, Math.min(19, (innerWidth - 24) / 80 / 0.55)); $('scr').style.fontSize = px.toFixed(1) + 'px'; }
  addEventListener('resize', fit); fit();

  // ask(): VistA-style prompt. "PROMPT: DEFAULT// "  returns '' / text / '^'
  async function ask(prompt, o = {}) {
    w(prompt + (o.def != null && o.def !== '' ? `${o.def}// ` : ''));
    let a = (await readLine(!o.secret)).trim();
    if (a === '' && o.def != null) a = String(o.def);
    return a;
  }
  async function yn(prompt, def = 'NO') {
    for (;;) {
      const a = (await ask(prompt + '? ', { def })).toUpperCase();
      if (a === '^') return null;
      if ('YES'.startsWith(a) && a) return true;
      if ('NO'.startsWith(a) && a) return false;
      wl("     Answer with 'Yes' or 'No'");
    }
  }
  const pressReturn = async () => (await ask('Enter RETURN to continue or \'^\' to exit: ')) === '^' ? '^' : '';

  // ===================================================================
  //  Dates (FileMan style). "Today" is Jun 29, 2026 (the desktop date)
  // ===================================================================
  const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const MONc = MON.map(m => m[0] + m.slice(1).toLowerCase());
  const now = () => { const n = new Date(); return new Date(2026, 5, 29, n.getHours(), n.getMinutes(), n.getSeconds()); };
  const TODAY = new Date(2026, 5, 29);
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const fmD = d => `${MON[d.getMonth()]} ${pad(d.getDate())}, ${d.getFullYear()}`;                     // JUN 29, 2026
  const fmDT = d => `${fmD(d)}@${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const fmDc = d => `${MONc[d.getMonth()]} ${pad(d.getDate())}, ${d.getFullYear()}`;                   // Jun 29, 2026
  const fmS = d => `${pad(d.getMonth() + 1)}/${pad(d.getDate())}/${String(d.getFullYear()).slice(2)}`; // 06/29/26
  const fmDOB = d => `${d.getMonth() + 1}-${d.getDate()}-${String(d.getFullYear()).slice(2)}`;
  const lmNow = () => { const n = now(); return `${fmDc(n)}@${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`; };
  const isoL = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  // parse T, T+n, T-n, NOW, MM/DD, MM/DD/YY(YY), JUL 6, with optional @time (10, 1030, 10:30, 2P)
  function fmParse(v, { time = 'opt' } = {}) {
    v = String(v || '').trim().toUpperCase(); if (!v) return null;
    if (v === 'NOW' || v === 'N') return now();
    let [dp, tp] = v.split('@'); let d = null;
    let m;
    if (dp === 'T' || dp === 'TODAY' || dp === '') d = new Date(TODAY);
    else if ((m = dp.match(/^T\s*([+-])\s*(\d+)$/))) d = addDays(TODAY, (m[1] === '-' ? -1 : 1) * +m[2]);
    else if ((m = dp.match(/^(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2}|\d{4}))?$/))) { let y = m[3] ? +m[3] : TODAY.getFullYear(); if (y < 100) y += 2000; d = new Date(y, +m[1] - 1, +m[2]); if (d.getMonth() !== +m[1] - 1) return null; }
    else if ((m = dp.match(/^([A-Z]{3})[A-Z]*\s*(\d{1,2}),?\s*(\d{4})?$/)) && MON.includes(m[1])) d = new Date(m[3] ? +m[3] : TODAY.getFullYear(), MON.indexOf(m[1]), +m[2]);
    else return null;
    if (tp != null) {
      if (time === 'no') return null;
      if (tp === 'NOW') { const n = now(); d.setHours(n.getHours(), n.getMinutes()); }
      else if ((m = tp.match(/^(\d{1,2})(?::?(\d{2}))?\s*(A|P|AM|PM)?$/))) {
        let h = +m[1], mi = m[2] ? +m[2] : 0; if (m[3] && m[3][0] === 'P' && h < 12) h += 12; if (m[3] && m[3][0] === 'A' && h === 12) h = 0;
        if (!m[3] && h >= 1 && h <= 6) h += 12; // 1-6 without AM/PM are afternoon, like FileMan
        if (h > 23 || mi > 59) return null; d.setHours(h, mi);
      } else return null;
      d.hasTime = true;
    } else if (time === 'req') return null;
    return d;
  }

  // ===================================================================
  //  Patients and shared data
  // ===================================================================
  const AUTHOR = 'BORNE,BEN', AUTHOR_LONG = 'BEN BORNE', AUTHOR_TITLE = 'RN, HOME TELEHEALTH CARE COORDINATOR';
  const STATION = 'VA DEMO HCS', STA = '999';
  const P = [
    ['robert', 'HALE', 'ROBERT', '000-00-1001', [1958, 2, 14], 'M', 'HTN', 'SC LESS THAN 50%', 1, 'VIETNAM ERA', ['1418 OAK HOLLOW DR', '', 'SPRINGFIELD', 'IL', '62704'], '217-555-0110', 'SANGAMON'],
    ['david', 'MORENO', 'DAVID', '000-00-1002', [1961, 7, 2], 'M', 'HTN', 'NSC', 7, 'POST-VIETNAM', ['22 CEDAR CT', 'APT 4', 'SPRINGFIELD', 'IL', '62711'], '217-555-0111', 'SANGAMON'],
    ['kyle', 'BENNETT', 'KYLE', '000-00-1003', [1966, 10, 23], 'M', 'HTN', 'NSC', 8, 'PERSIAN GULF WAR', ['905 RIVER RD', '', 'CHATHAM', 'IL', '62629'], '217-555-0112', 'SANGAMON'],
    ['brad', 'FOSTER', 'BRAD', '000-00-1004', [1954, 4, 9], 'M', 'HF', 'AID & ATTENDANCE', 4, 'VIETNAM ERA', ['3310 PRAIRIE VIEW LN', '', 'ROCHESTER', 'IL', '62563'], '217-555-0113', 'SANGAMON'],
    ['miles', 'CARTER', 'MILES', '000-00-1005', [1952, 0, 30], 'M', 'HF', 'SC 50% to 100%', 1, 'VIETNAM ERA', ['71 LINCOLN AVE', '', 'SPRINGFIELD', 'IL', '62702'], '217-555-0114', 'SANGAMON'],
    ['phil', 'DAWSON', 'PHIL', '000-00-1006', [1957, 8, 17], 'M', 'HF', 'SC LESS THAN 50%', 2, 'VIETNAM ERA', ['4402 SUNSET BLVD', '', 'SHERMAN', 'IL', '62684'], '217-555-0115', 'SANGAMON'],
    ['bob', 'TURNER', 'BOB', '000-00-1007', [1963, 5, 6], 'M', 'WM', 'NSC, VA PENSION', 5, 'POST-VIETNAM', ['18 BIRCH ST', '', 'PETERSBURG', 'IL', '62675'], '217-555-0116', 'MENARD'],
    ['michelle', 'REYES', 'MICHELLE', '000-00-1008', [1970, 11, 1], 'F', 'WM', 'SC LESS THAN 50%', 6, 'PERSIAN GULF WAR', ['650 MEADOW DR', 'UNIT B', 'SPRINGFIELD', 'IL', '62707'], '217-555-0117', 'SANGAMON'],
    ['sarah', 'COLLINS', 'SARAH', '000-00-1009', [1968, 3, 19], 'F', 'WM', 'NSC', 6, 'PERSIAN GULF WAR', ['2201 HILLCREST AVE', '', 'AUBURN', 'IL', '62615'], '217-555-0118', 'SANGAMON']
  ].map(r => ({ id: r[0], last: r[1], first: r[2], ssn: r[3], dob: new Date(...r[4]), sex: r[5], prog: r[6], elig: r[7], pg: r[8], pos: r[9], addr: r[10], phone: r[11], county: r[12] }));
  P.forEach(p => { p.name = `${p.last},${p.first}`; p.l4 = p.last[0] + p.ssn.slice(-4); p.ssn9 = p.ssn.replace(/-/g, ''); p.sc = !p.elig.startsWith('NSC') && p.elig !== 'AID & ATTENDANCE'; });
  const byId = Object.fromEntries(P.map(p => [p.id, p]));
  const sorted = [...P].sort((a, b) => a.name.localeCompare(b.name));
  const progName = p => p.prog === 'HTN' ? 'HYPERTENSION' : p.prog === 'HF' ? 'HEART FAILURE' : 'MOVE! WEIGHT MANAGEMENT';
  const DX = { HTN: [['I10', 'Essential (primary) hypertension'], ['E78.5', 'Hyperlipidemia, unspecified'], ['E66.3', 'Overweight']],
    HF: [['I50.22', 'Chronic systolic (congestive) heart failure'], ['I10', 'Essential (primary) hypertension'], ['I48.91', 'Unspecified atrial fibrillation']],
    WM: [['E66.9', 'Obesity, unspecified'], ['R73.03', 'Prediabetes'], ['G47.33', 'Obstructive sleep apnea (adult) (pediatric)']] };
  const CPT = [['98966', 'TELEPHONE ASSESSMENT 5-10 MIN (NON-PHYSICIAN)'], ['98967', 'TELEPHONE ASSESSMENT 11-20 MIN (NON-PHYSICIAN)'], ['98968', 'TELEPHONE ASSESSMENT 21-30 MIN (NON-PHYSICIAN)'], ['99091', 'COLLECT/INTERPRET PHYSIOLOGIC DATA, 30 MIN'], ['G0406', 'FOLLOW-UP TELEHEALTH CONSULT, 15 MIN']];
  const CLINICS = [
    { name: 'HT CC 685 TELEPHONE', stop: '685', len: 20 },
    { name: 'HT CC 179 VIDEO', stop: '179', len: 30 },
    { name: 'HT CC 686 NON-VIDEO', stop: '686', len: 20 },
    { name: 'HT INTAKE 685', stop: '685', len: 60 }
  ];

  // CPRS progress notes (shared with the CPRS window). Same seed as CPRS.
  function loadNotes() {
    let n = getJson('cprsNotes', null);
    if (!n) {
      n = {};
      P.forEach(p => {
        const d1 = new Date(2026, 0, 2, 10, 12), d2 = new Date(2026, 3, 15, 14, 5);
        n[p.id] = [
          { id: p.id + '-1', title: 'HOME TELEHEALTH NOTE', date: d1.toISOString(), author: AUTHOR, signed: true, signedAt: d1.toISOString(),
            text: `Patient enrolled in VA Home Telehealth (RPM) ${p.prog === 'HTN' ? 'Hypertension' : p.prog === 'HF' ? 'Heart Failure' : 'MOVE! Weight Management'} program.\nEquipment issued and patient instructed on daily use. Patient verbalized\nunderstanding and was able to complete a session independently.\n\nWill follow per Home Telehealth protocol.` },
          { id: p.id + '-2', title: 'RPM-HT PERIODIC EVALUATION NOTE', date: d2.toISOString(), author: AUTHOR, signed: true, signedAt: d2.toISOString(),
            text: 'Periodic evaluation completed by telephone. Reviewed readings and DMP\nresponses with patient. Patient remains appropriate for Home Telehealth.\nContinue current plan of care.' }];
      });
    }
    return n;
  }
  const notesFor = id => (loadNotes()[id] || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  function saveNote(ptId, note) { const n = loadNotes(); n[ptId] = n[ptId] || []; const i = n[ptId].findIndex(x => x.id === note.id); if (i >= 0) n[ptId][i] = note; else n[ptId].push(note); setJson('cprsNotes', n); }
  function deleteNote(ptId, id) { const n = loadNotes(); n[ptId] = (n[ptId] || []).filter(x => x.id !== id); setJson('cprsNotes', n); }
  const TITLES = ['HOME TELEHEALTH CARE COORDINATION NOTE', 'HOME TELEHEALTH NOTE', 'HOME TELEHEALTH NON-RESPONDER NOTE', 'HOME TELEHEALTH DISCHARGE NOTE',
    'RPM-HT PERIODIC EVALUATION NOTE', 'RPM-HT TECH EDUCATION NOTE', 'MOVE! TELEHEALTH NOTE', 'NURSING NOTE', 'PRIMARY CARE TELEPHONE NOTE', 'PRIMARY CARE NOTE'];

  // VistA-only data: appointments, consults, Home Telehealth enrollment
  const SEED_V = 1;
  let DB;
  function seed() {
    DB = { appts: [], consults: [], ht: {}, seq: 100, hl7: 74102 };
    P.forEach((p, i) => {
      DB.appts.push({ id: DB.seq++, pt: p.id, clinic: 'HT INTAKE 685', dt: '2026-01-02T10:00', len: 60, type: 'REGULAR', status: 'CHECKED OUT', co: '2026-01-02T10:50', dx: DX[p.prog][0][0], cpt: '98968', prov: AUTHOR });
      DB.appts.push({ id: DB.seq++, pt: p.id, clinic: 'HT CC 685 TELEPHONE', dt: '2026-04-15T14:00', len: 20, type: 'REGULAR', status: 'CHECKED OUT', co: '2026-04-15T14:20', dx: DX[p.prog][0][0], cpt: '98967', prov: AUTHOR });
      DB.appts.push({ id: DB.seq++, pt: p.id, clinic: 'HT CC 685 TELEPHONE', dt: `2026-07-${pad(6 + i)}T${pad(9 + (i % 5))}:${i % 2 ? '20' : '00'}`, len: 20, type: 'REGULAR', status: 'FUTURE' });
      DB.consults.push({ no: 4410 + i, pt: p.id, svc: 'HOME TELEHEALTH ENROLLMENT', date: '2025-12-18T09:' + pad(10 + i), status: 'c', urg: 'ROUTINE', place: 'CONSULTANT\'S CHOICE', from: 'PROVIDER,PRIMARY CARE',
        reason: `Please evaluate for enrollment in Home Telehealth ${progName(p).toLowerCase()} program.\nPatient agreeable to daily vital sign and symptom monitoring.`,
        log: [['2025-12-18T09:' + pad(10 + i), 'CPRS RELEASED ORDER', 'PROVIDER,PRIMARY CARE', ''], ['2025-12-19T08:30', 'RECEIVED', AUTHOR, ''], ['2026-01-02T10:12', 'COMPLETE/UPDATE', AUTHOR, 'Note: HOME TELEHEALTH NOTE (01/02/26)']] });
      DB.ht[p.id] = { status: 'ACTIVE', vendor: 'CARECONSOLE', coc: p.prog === 'WM' ? 'HP/DP' : 'CCM', cc: AUTHOR, consult: 4410 + i,
        hist: [{ act: 'ACTIVATION', date: '2026-01-02T10:15', by: AUTHOR, coc: p.prog === 'WM' ? 'HP/DP' : 'CCM', hl7: DB.hl7++, ack: 'AA' }] };
    });
    // A few items to work today
    DB.appts.push({ id: DB.seq++, pt: 'robert', clinic: 'HT CC 685 TELEPHONE', dt: '2026-06-29T10:30', len: 20, type: 'REGULAR', status: 'FUTURE' });
    DB.appts.push({ id: DB.seq++, pt: 'brad', clinic: 'HT CC 685 TELEPHONE', dt: '2026-06-29T13:00', len: 20, type: 'REGULAR', status: 'FUTURE' });
    DB.appts.push({ id: DB.seq++, pt: 'sarah', clinic: 'HT CC 179 VIDEO', dt: '2026-06-29T09:00', len: 30, type: 'REGULAR', status: 'CHECKED IN', ci: '2026-06-29T08:57' });
    DB.appts.push({ id: DB.seq++, pt: 'phil', clinic: 'HT CC 685 TELEPHONE', dt: '2026-06-26T11:00', len: 20, type: 'REGULAR', status: 'FUTURE' });
    DB.consults.push({ no: 4425, pt: 'phil', svc: 'HOME TELEHEALTH RE-EVALUATION', date: '2026-06-25T15:02', status: 'p', urg: 'ROUTINE', place: 'CONSULTANT\'S CHOICE', from: 'PROVIDER,PRIMARY CARE',
      reason: 'Patient with recent HF exacerbation. Please re-evaluate Home Telehealth\ncategory of care and DMP. Consider increasing monitoring frequency.', log: [['2026-06-25T15:02', 'CPRS RELEASED ORDER', 'PROVIDER,PRIMARY CARE', '']] });
    DB.consults.push({ no: 4426, pt: 'bob', svc: 'MOVE! TELEHEALTH', date: '2026-06-27T10:40', status: 'p', urg: 'ROUTINE', place: 'CONSULTANT\'S CHOICE', from: 'PROVIDER,PRIMARY CARE',

    save(); localStorage.setItem('vistaSeed', String(SEED_V));
  }
  function save() { setJson('vistaDB', DB); }
  if (localStorage.getItem('vistaSeed') !== String(SEED_V)) seed(); else DB = getJson('vistaDB', null) || (seed(), DB);
  const apptDate = a => new Date(a.dt);
  function apptStatus(a) {
    if (a.status === 'FUTURE') return apptDate(a) < TODAY ? 'NO ACTION TAKEN' : 'FUTURE';
    return a.status;
  }
  const ptAppts = id => DB.appts.filter(a => a.pt === id).sort((a, b) => a.dt.localeCompare(b.dt));

  // ===================================================================
  //  Common lookups
  // ===================================================================
  function ptLine(p) { return `${L(p.name, 22)}  ${L(fmDOB(p.dob), 9)} ${p.ssn9}     YES     ${p.sc ? 'SC VETERAN' : 'NSC VETERAN'}`; }
  async function selectPatient(prompt = 'Select PATIENT NAME: ', initial) {
    for (;;) {
      const a = initial != null ? initial : (await ask(prompt)).toUpperCase(); initial = null;
      if (!a || a === '^') return null;
      if (a === '?' || a === '??') { wl(' Answer with PATIENT NAME, or SOCIAL SECURITY NUMBER, or last 4 of SSN, or'); wl(' first initial of last name with last 4 of SSN (e.g. H1001).'); if (a === '??') sorted.forEach(p => wl('   ' + ptLine(p))); continue; }
      let m;
      if (/^[A-Z]\d{4}$/.test(a)) m = P.filter(p => p.l4 === a);
      else if (/^\d{4}$/.test(a)) m = P.filter(p => p.ssn.endsWith(a));
      else if (/^\d{3}-?\d{2}-?\d{4}$/.test(a)) m = P.filter(p => p.ssn9 === a.replace(/-/g, ''));
      else { const [l, f = ''] = a.split(','); m = sorted.filter(p => p.last.startsWith(l.trim()) && p.first.startsWith(f.trim())); }
      if (!m.length) { wl(' ??'); continue; }
      let p = m[0];
      if (m.length > 1) {
        m.forEach((x, i) => wl(`     ${i + 1}   ${ptLine(x)}`));
        const c = await ask(`CHOOSE 1-${m.length}: `); const n = +c; if (!n || n < 1 || n > m.length) continue; p = m[n - 1];
        wl('  ' + ptLine(p));
      } else wl('  ' + ptLine(p));

  }
  async function pickFrom(prompt, list, { def, show = true } = {}) { // list of strings; prefix match
    for (;;) {
      const a = (await ask(prompt, { def })).toUpperCase();
      if (!a || a === '^') return a === '^' ? '^' : null;
      if (a.startsWith('?')) { list.forEach(x => wl('   ' + x)); continue; }
      const m = list.filter(x => x.toUpperCase().startsWith(a));
      if (m.length === 1) { if (m[0].toUpperCase() !== a) { lines[lines.length - 2].push([m[0].slice(a.length), '']); paint(); } return m[0]; }

  async function lineEditor(text = '') {
    const out = text ? text.split('\n') : [];
    wl(); wl('  Enter the note text. Press RETURN on a blank line to finish.', 'dim');
    if (out.length) { wl('  Existing text:'); out.forEach((t, i) => wl(`${R(i + 1, 3)}>${t}`)); }
    for (;;) { const t = await ask(`${R(out.length + 1, 3)}>`); if (t === '') break; out.push(t.slice(0, 79)); }
    for (;;) {
      const a = (await ask('EDIT Option: ')).toUpperCase();
      if (a === '' ) return out.join('\n');
      if (a === '^') return null;
      if (a === 'L' || a === 'LIST') { out.forEach((t, i) => wl(`${R(i + 1, 3)}>${t}`)); continue; }
      if (a === 'A' || a === 'ADD') { for (;;) { const t = await ask(`${R(out.length + 1, 3)}>`); if (t === '') break; out.push(t.slice(0, 79)); } continue; }
      if (a === 'D' || a === 'DELETE') { const n = +(await ask('Delete line: ')); if (n >= 1 && n <= out.length) { out.splice(n - 1, 1); wl('  Deleted.'); } continue; }
      if (a === 'E' || a === 'EDIT') { const n = +(await ask('Edit line: ')); if (n >= 1 && n <= out.length) { wl(`${R(n, 3)}>${out[n - 1]}`); const t = await ask('Replace with: '); if (t !== '^' && t) out[n - 1] = t.slice(0, 79); } continue; }

    });
    wl('-'.repeat(79));
    const by = c => act.filter(p => DB.ht[p.id].coc === c).length;
    wl(` TOTAL ACTIVE: ${act.length}     CCM: ${by('CCM')}   ACM: ${by('ACM')}   HP/DP: ${by('HP/DP')}   NIC: ${by('NIC')}`);
    wl(); await pressReturn();
  }
  async function htActReport() {
    const f = await askDate('START DATE: ', { def: 'T-30', time: 'no' }); if (!f || f === '^') return;
    const t = await askDate('END DATE: ', { def: 'T', time: 'no' }); if (!t || t === '^') return;
    const rows = P.flatMap(p => (DB.ht[p.id]?.hist || []).filter(x => new Date(x.date) >= f && new Date(x.date) < addDays(t, 1)).map(x => ({ p, x })));
    wl(); wl(`HOME TELEHEALTH ACTIVATIONS/INACTIVATIONS  ${fmS(f)} - ${fmS(t)}`, 'hi'); wl('-'.repeat(79));
    if (!rows.length) wl('  No activations or inactivations in this date range.');
    rows.sort((a, b) => a.x.date.localeCompare(b.x.date)).forEach(({ p, x }) => wl(` ${fmS(new Date(x.date))}  ${L(x.act, 13)} ${L(p.name, 22)} ${p.l4}  ${L(x.coc || '', 6)} ${x.reason || ''}`));
    wl(); await pressReturn();
  }

  // ===================================================================
  //  Sign-on and primary menu
  // ===================================================================
  const MENU_HT = { title: 'Home Telehealth', items: [
    ['1', 'Home Telehealth Patient Activation', htActivate],
    ['2', 'Home Telehealth Patient Inactivation', htInactivate],
    ['3', 'Home Telehealth Patient Inquiry', htInquiry],
    ['4', 'Home Telehealth Census Report', htCensus],
    ['5', 'Activation/Inactivation Report', htActReport]] };
  const MENU_SD = { title: 'Scheduling Menu', items: [
    ['AM', 'Appointment Management', apptMgmt],
    ['MA', 'Make Appointment', async () => { const p = await selectPatient(); if (p) await makeAppt(p); }],
    ['DA', 'Display Appointments', displayAppts],
    ['AL', 'Appointment List', clinicList]] };
  const MENU_TIU = { title: 'Progress Notes User Menu', items: [
    ['1', 'Entry of Progress Note', () => entryOfNote()],
    ['2', 'Review Progress Notes by Patient', () => reviewByPatient()],
    ['3', 'Review Unsigned Progress Notes', unsignedAcross],
    ['4', 'Individual Patient Document', () => reviewByPatient()]] };
  const MENU_TOP = [
    ['HT', 'Home Telehealth Menu', MENU_HT],
    ['SD', 'Scheduling Menu', MENU_SD],
    ['PI', 'Patient Inquiry', patientInquiry],
    ['TIU', 'Progress Notes User Menu', MENU_TIU],
    ['CT', 'Consult Tracking', () => consultTracking()]
  ];

  async function session() {
    cls();
    wl(); wl(`Volume set: ROU:DEMO  UCI: VAH  Device: /dev/pts/14`); wl();
    wl(`                ${'*'.repeat(46)}`, 'hi');
    wl(`                *     ${L('VA DEMO HEALTH CARE SYSTEM (' + STA + ')', 39)}*`, 'hi');
    wl(`                *     ${L('VistA - SIMULATION FOR DEMONSTRATION', 39)}*`, 'hi');
    wl(`                ${'*'.repeat(46)}`, 'hi'); wl();
    wl('  This is a U.S. Government information system. Use is restricted to');
    wl('  authorized users and is subject to monitoring.  (Simulated banner.)'); wl();
    wl('  Simulation: any access and verify codes are accepted. Do not enter real codes.', 'dim'); wl();
    for (let i = 0; ; i++) {
      const a = await ask('ACCESS CODE: ', { secret: true }); if (a === '^') return bye();
      const v = await ask('VERIFY CODE: ', { secret: true }); if (v === '^') return bye();
      if (a && v) break;
      wl(); wl('Not a valid ACCESS CODE/VERIFY CODE pair.'); if (i >= 2) return bye();
    }
    const h = now().getHours();
    wl(); wl(`Good ${h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening'} ${AUTHOR}`);
    wl(`     You last signed on today at 07:58`);
    wl(); const div = await ask('Select DIVISION: ', { def: `${STATION}  ${STA}` }); if (div === '^') return bye();
    wl(); wl('Terminal Type set to: C-VT320'); wl();
    const r = await menu('HOME TELEHEALTH CC MENU', MENU_TOP, true);
    return bye(r);
  }
  async function bye() {
    const t = now();
    wl(); wl(`Logged out at ${fmDT(t).replace(/(\w{3}) (\d\d), (\d{4})@/, (m, a, b, c) => `${a[0]}${a.slice(1).toLowerCase()} ${b}, ${c} `)}`); wl();
    wl('[Session closed. Press RETURN to connect again.]', 'dim');
    await readLine(false); return session();
  }

  $('term').focus();
  session();
})();
</script>
